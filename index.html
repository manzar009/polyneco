const BOOKCOL=['#3BA8F5','#34C77B','#FF6FA8','#9B7BF7'];
function vStories(v,bi=null,pg=0){const lg=L();
 if(bi===null){v.innerHTML=`<p class="lead" style="margin:0 0 24px">Short stories written for A1 learners. Hover any word for its meaning, click a sentence to hear it.</p><div class="books">${STORY4.map((b,i)=>`<button class="book" data-b="${i}" style="background:${BOOKCOL[i%4]}"><span class="kick" style="background:rgba(255,255,255,.25);color:#fff">A1 · ${b.pages[lg].length} PAGES</span><h3 class="${lgCls(lg)}" style="margin-top:16px">${esc(b.title[lg])}</h3><p style="font-weight:800;opacity:.85;margin-top:8px">${esc(b.title.en)}</p><span class="bc" id="bk${i}"></span></button>`).join('')}</div>`;
  STORY4.forEach((b,i)=>mute(catIn($('#bk'+i),{state:b.moods[0]})));$$('[data-b]',v).forEach(b=>b.addEventListener('click',()=>vStories(v,+b.dataset.b,0)));return}
 const b=STORY4[bi],P=b.pages[lg],E=b.pages.en,N=P.length;
 v.innerHTML=`<div class="rhead"><button class="btn ghost sm" id="rb">← All stories</button><h2 style="font-size:30px;font-weight:1000;flex:1" class="${lgCls(lg)}">${esc(b.title[lg])}</h2><span class="toggle ${S.showEn!==false?'on':''}" id="ten"><i></i>English</span><button class="btn sm" id="rall">${ic('speaker')}Read page</button></div>
  <div class="reader ${S.showEn===false?'hideen':''} ${lgCls(lg)}" id="rd" dir="${lg==='ar'?'rtl':'ltr'}"><div style="display:flex;align-items:center;gap:20px;margin-bottom:20px" dir="ltr"><span id="rcat" style="display:block;width:120px;height:110px;flex:none"></span><span style="width:90px;height:90px;display:block">${PROPS[b.scenes[pg]]||''}</span></div>
   <div class="pg">${P[pg].map((s,i)=>`<div class="sent" data-i="${i}">${glossHTML(s,lg)}<span class="en" dir="ltr">${esc(E[pg][i])}</span></div>`).join('')}</div>
   <div class="rnav" dir="ltr"><button class="btn ghost sm" id="rp" ${pg?'':'disabled'}>← Back</button><div class="dots">${P.map((_,i)=>`<i class="${i===pg?'on':''}"></i>`).join('')}</div><button class="btn sm" id="rn">${pg<N-1?'Next page →':'Finish story'}</button></div></div>`;
 mute(catIn($('#rcat'),{state:b.moods[pg]||'happy'}));
 $('#rb').addEventListener('click',()=>vStories(v));$('#ten').addEventListener('click',()=>{S.showEn=S.showEn===false;save();vStories(v,bi,pg)});
 $$('.sent',v).forEach(s=>s.addEventListener('click',()=>{say(P[pg][+s.dataset.i],lg);$$('.sent',v).forEach(x=>x.classList.toggle('speaking',x===s))}));
 $('#rall').addEventListener('click',()=>say(P[pg].join(' '),lg));
 const go=d=>{if(pg+d>=N){addFish(30);stamp('book');confetti(60);Sound.win();toast(`${ic('fish')} +30 fish for finishing the story!`);vStories(v);return}if(pg+d>=0)vStories(v,bi,pg+d)};
 $('#rp').addEventListener('click',()=>go(-1));$('#rn').addEventListener('click',()=>go(1));
 removeEventListener('keydown',vStories._k);vStories._k=e=>{if(!$('#rd')){removeEventListener('keydown',vStories._k);return}if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)};addEventListener('keydown',vStories._k)}

/* ---- Dictionary ---- */
function vWords(v){const lg=L();v.innerHTML=`<label class="search">${ic('search')}<input id="q" placeholder="Search ${VOCAB.length} words in English or ${LANGS[lg].name}…" autocomplete="off"></label><div class="dgrid" id="dg"></div>`;
 const draw=q=>{q=(q||'').toLowerCase().trim();$('#dg').innerHTML=VOCAB.map(x=>W(x[0],lg)).filter(w=>!q||w.en.toLowerCase().includes(q)||w.word.toLowerCase().includes(q)||(w.rom||'').toLowerCase().includes(q)).map(w=>`<div class="dc" data-w="${esc(w.word)}"><div class="in"><div class="fa"><span class="w ${lgCls(lg)}">${esc(w.word)}</span>${w.rom?`<span class="r">${esc(w.rom)}</span>`:''}</div><div class="fb"><span class="e">${pic(w.pic)}</span><span class="w">${esc(w.en)}</span></div></div></div>`).join('')||'<p class="lead">No words found. Neko is still learning that one.</p>';
  $$('.dc').forEach(c=>c.addEventListener('click',()=>{say(c.dataset.w,lg);BUDDY&&BUDDY.set('happy',800)}))};

function vProfile(v){const acc=S.total?Math.round(S.right/S.total*100):0,lg=L();
 v.innerHTML=`<div class="prof"><div class="pcard"><div class="pav"><div class="host" id="pcat"></div></div><input class="nm" id="nm" value="${esc(S.name)}" placeholder="Your name" maxlength="24"><div style="font-weight:800;color:var(--mute)">Learning ${flag(lg,'r')} ${LANGS[lg].name} · ${myLeague().name} League</div>
