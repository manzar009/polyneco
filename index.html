<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polyneco · Learn a language with Neko the cat</title>
<meta name="description" content="Learn Japanese, Spanish, French, German, Arabic or English with Neko, a very nosy cat. Five minutes a day, fish for every right answer.">
<meta name="theme-color" content="#F07A1F"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+Arabic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --o50:#FFF4EA;--o100:#FFE6D1;--o200:#FFCFA8;--o300:#FFB57A;--o400:#F9994B;--o500:#F07A1F;--o600:#D9620C;--o700:#B9510A;--o800:#9A4212;
 --ink:#3A2A20;--ink2:#6E5A4C;--mute:#A8968A;--line:#F1E6DB;--cream:#FFF9F3;--sand:#F6EEE6;--card:#fff;
 --blue:#3BA8F5;--sun:#FFC93C;--green:#34C77B;--red:#F2545B;--pink:#FF6FA8;--lav:#9B7BF7;--teal:#19B5A5;
 --sh1:0 1px 3px rgba(154,66,18,.07);--sh2:0 10px 30px rgba(154,66,18,.13);--sh3:0 24px 60px rgba(154,66,18,.2);
 --spring:cubic-bezier(.3,1.55,.5,1);--soft:cubic-bezier(.45,0,.25,1);
 --wallH:clamp(180px,24vh,270px);--cw:min(50vw,84vh,860px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.ja{font-family:'Noto Sans JP',Nunito,sans-serif}.ar{font-family:'Noto Sans Arabic',Nunito,sans-serif}
::selection{background:var(--o200)}
.flag{display:inline-block;width:30px;height:22px;border-radius:7px;overflow:hidden;flex:none;box-shadow:0 0 0 1.5px rgba(58,42,32,.06)}
.flag svg,.ico svg{width:100%;height:100%;display:block}
.flag.r{width:28px;height:28px;border-radius:50%}
.ico{display:inline-block;width:24px;height:24px;flex:none}
.mode-app .site,.mode-site .app{display:none!important}

/* ===== Logo ===== */
.logo{font-size:30px;font-weight:1000;letter-spacing:-1px;display:inline-flex;align-items:center;color:var(--o500);line-height:1}
.logo .o{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:currentColor;position:relative;margin:0 .04em;top:.04em;transition:transform .5s var(--spring)}
.logo .o::before,.logo .o::after{content:"";position:absolute;top:-.17em;width:0;height:0;border-left:.15em solid transparent;border-right:.15em solid transparent;border-bottom:.27em solid currentColor}
.logo .o::before{left:.04em;transform:rotate(-14deg)}.logo .o::after{right:.04em;transform:rotate(14deg)}
.logo .o i{position:absolute;top:.3em;width:.12em;height:.15em;border-radius:50%;background:var(--cream);transition:transform .2s}
.logo .o i:first-child{left:.2em}.logo .o i:last-child{right:.2em}
.logo:hover .o{transform:rotate(-12deg) scale(1.1)}
.logo:hover .o i{transform:scaleY(.2)}

/* ===== Buttons ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font-weight:900;font-size:17px;color:#fff;background:var(--o500);transition:transform .35s var(--spring),background .2s,box-shadow .3s;white-space:nowrap;box-shadow:0 6px 0 var(--o700)}
.btn:hover{transform:translateY(-3px);background:#F5862E;box-shadow:0 9px 0 var(--o700)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--o700);transition-duration:.08s}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line)}
.btn.ghost:hover{box-shadow:0 9px 0 var(--line);background:#fff}
.btn.ghost:active{box-shadow:0 2px 0 var(--line)}
.btn.green{background:var(--green);box-shadow:0 6px 0 #22975A}.btn.green:hover{background:#3DD486;box-shadow:0 9px 0 #22975A}
.btn.red{background:var(--red);box-shadow:0 6px 0 #C93940}
.btn.sm{height:42px;padding:0 18px;font-size:15px;box-shadow:0 4px 0 var(--o700)}
.btn.ghost.sm{box-shadow:0 4px 0 var(--line)}
.btn[disabled]{filter:grayscale(1) opacity(.45);pointer-events:none}
.btn .ico{width:24px;height:24px}

/* The mega CTA: grows cat ears on hover */
.mega{height:96px;padding:0 48px 0 44px;font-size:34px;letter-spacing:-.5px;box-shadow:0 10px 0 var(--o700),0 30px 50px -10px rgba(240,122,31,.45);gap:16px}
.mega:hover{transform:translateY(-5px) rotate(-1.5deg);box-shadow:0 15px 0 var(--o700),0 40px 60px -10px rgba(240,122,31,.5)}
.mega:active{transform:translateY(6px);box-shadow:0 4px 0 var(--o700)}
.mega .ears{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
.mega .ears i{position:absolute;top:0;width:52px;height:46px;background:var(--o500);clip-path:polygon(50% 0,100% 100%,0 100%);transform:translateY(30px) scale(.4);opacity:0;transition:transform .45s var(--spring),background .2s,opacity .15s;transform-origin:50% 100%}
.mega .ears i::after{content:"";position:absolute;left:30%;right:30%;top:40%;bottom:0;background:#FF9FA8;clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.85}
.mega .ears i:first-child{left:34px;rotate:-14deg}.mega .ears i:last-child{right:34px;rotate:14deg}
.mega:hover .ears i{opacity:1;transform:translateY(-38px) scale(1);background:#F5862E}
.mega .arr{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.22);transition:transform .45s var(--spring)}
.mega:hover .arr{transform:translateX(6px) rotate(-8deg)}
.mega .arr svg{width:30px;height:30px}
.mega.ghost{background:#fff;color:var(--ink);box-shadow:0 10px 0 var(--line)}
.mega.ghost .ears i{background:#fff}.mega.ghost:hover .ears i{background:#fff}

/* ===== Site nav ===== */
.nav{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;align-items:center;gap:28px;padding:22px 48px;transition:background .3s,box-shadow .3s,padding .3s}
.nav.solid{background:rgba(255,249,243,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);padding:14px 48px}
.nav .links{display:flex;gap:6px;margin-left:24px}
.nav .links a{position:relative;padding:10px 16px;border-radius:999px;font-weight:800;font-size:16px;color:var(--ink2);transition:color .2s,background .2s}
.nav .links a:hover{color:var(--ink);background:var(--o100)}
.nav .sp{flex:1}
.nav .pawc{display:inline-flex;align-items:center;gap:8px;font-weight:900;color:var(--ink2);padding:8px 14px;border-radius:999px;background:#fff;box-shadow:var(--sh1)}
.nav .pawc .ico{width:22px;height:22px}

/* ===== HERO ===== */
.hero{position:relative;height:100vh;min-height:760px;max-height:1200px;overflow:hidden;background:var(--cream)}
.hero .bgdots{position:absolute;inset:0;background-image:radial-gradient(rgba(240,122,31,.13) 1.6px,transparent 1.7px);background-size:28px 28px;mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent)}
.hero-copy{position:absolute;left:clamp(40px,5.5vw,110px);top:clamp(96px,12.5vh,160px);z-index:6;max-width:min(62vw,980px)}
.hero h1{font-size:clamp(60px,min(8.2vw,12.4vh),164px);line-height:.86;font-weight:1000;letter-spacing:-.055em;color:var(--ink)}
.hero h1 .ln{display:block;white-space:nowrap}
.hero h1 .w{display:inline-block;transition:transform .5s var(--spring),color .2s;transform-origin:50% 90%}
.hero h1 .w:hover{transform:translateY(-.06em) rotate(-4deg) scale(1.04)}
.hero h1 .psst{color:var(--o500);font-style:normal}
.hero h1 .hl{position:relative;color:#fff;padding:0 .14em;margin:0 -.02em}
.hero h1 .hl::before{content:"";position:absolute;inset:.1em -.02em .02em;background:var(--blue);border-radius:.18em;z-index:-1;transform:rotate(-2deg);transition:transform .5s var(--spring),background .3s}
.hero h1 .hl:hover::before{transform:rotate(2deg) scale(1.04);background:var(--lav)}
.hero h1 .q{display:inline-block;color:var(--pink);animation:qbob 2.4s ease-in-out infinite}
@keyframes qbob{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg) translateY(-.04em)}}
.hero .sub{margin-top:22px;font-size:clamp(18px,min(1.4vw,2.4vh),24px);font-weight:800;color:var(--ink2);max-width:560px;line-height:1.4}
.hero .sub b{color:var(--ink)}
.hero .ctas{display:flex;align-items:center;gap:22px;margin-top:clamp(22px,3.4vh,40px)}
.hero .ctas .later{font-weight:900;font-size:19px;color:var(--ink2);padding:14px 10px;border-radius:12px;display:inline-flex;gap:8px;align-items:center;transition:color .2s}
.hero .ctas .later:hover{color:var(--ink)}
.hero .ctas .later .eyes{display:inline-block;transition:transform .3s var(--spring)}
.hero .ctas .later:hover .eyes{transform:translateX(4px) rotate(-10deg)}
.hero .proof{display:flex;gap:10px;align-items:center;margin-top:32px;font-weight:800;color:var(--mute);font-size:15px}
.hero .proof .flags{display:flex}
.hero .proof .flags .flag{margin-right:-6px;border:2px solid var(--cream);width:30px;height:30px;border-radius:50%;transition:transform .3s var(--spring)}
.hero .proof .flags .flag:hover{transform:translateY(-6px) scale(1.15);z-index:2}

/* the wall */
.wall{position:absolute;left:0;right:0;bottom:0;height:var(--wallH);z-index:3;background:var(--o500);
 background-image:linear-gradient(90deg,rgba(0,0,0,.0) 0,rgba(0,0,0,0) 100%),
  repeating-linear-gradient(0deg,transparent 0 58px,rgba(154,66,18,.14) 58px 62px),
  repeating-linear-gradient(90deg,transparent 0 118px,rgba(154,66,18,.1) 118px 122px)}
.wall::before{content:"";position:absolute;left:0;right:0;top:-10px;height:26px;background:var(--o400);border-radius:14px 14px 0 0;box-shadow:0 6px 0 rgba(154,66,18,.18)}
.wall .stk{position:absolute;padding:12px 22px;border-radius:18px;font-weight:1000;font-size:clamp(20px,1.7vw,30px);letter-spacing:-.5px;color:#fff;transform:rotate(var(--r,0deg));transition:transform .45s var(--spring),box-shadow .3s;box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:pointer;user-select:none;white-space:nowrap}
.wall .stk:hover{transform:rotate(0deg) scale(1.12) translateY(-6px);box-shadow:0 12px 22px rgba(0,0,0,.18);z-index:5}
.wall .stk small{display:block;font-size:12px;letter-spacing:.5px;opacity:.85;font-weight:900;text-transform:uppercase}
.wall .stk.circle{border-radius:50%;width:104px;height:104px;display:grid;place-items:center;text-align:center;padding:0;line-height:1.05;font-size:20px}
.wall .pp{position:absolute;width:34px;height:34px;opacity:.22}
.wall .scrollme{position:absolute;right:3%;bottom:22px;color:#fff;font-weight:900;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px;opacity:.9}
.wall .scrollme i{width:26px;height:40px;border:3px solid #fff;border-radius:14px;position:relative}
.wall .scrollme i::after{content:"";position:absolute;left:50%;top:7px;width:5px;height:8px;margin-left:-2.5px;border-radius:3px;background:#fff;animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}

/* the peeking cat */
.peek{position:absolute;right:clamp(10px,4vw,90px);width:var(--cw);height:calc(var(--cw) * 204 / 216);bottom:calc(var(--wallH) - var(--cw) * 76 / 216);z-index:2;pointer-events:none}
.peek .host{position:absolute;inset:0;transition:transform .7s var(--spring);pointer-events:auto}
.peek .host .nk{cursor:pointer}
.peek.duck .host{transform:translateY(46%);transition:transform .45s cubic-bezier(.6,0,.9,.5)}
.peek.up .host{transform:translateY(-5%)}
.peek .host .neko.n5{filter:none}
.pawsvg{position:absolute;right:clamp(10px,4vw,90px);width:var(--cw);height:calc(var(--cw) * 204 / 216);bottom:calc(var(--wallH) - var(--cw) * 76 / 216);z-index:4;pointer-events:none;overflow:visible}
.pawsvg .pg{transition:transform .6s var(--spring)}
.pawsvg.duck .pg{transform:translateY(40px);transition:transform .35s cubic-bezier(.6,0,.9,.5)}
.pawsvg .pg.l.tap{animation:ptap .5s ease 2}
@keyframes ptap{50%{transform:translateY(-5px) rotate(-6deg)}}
.pawsvg .n5-pawb{stroke:none!important}
.hbub{position:absolute;z-index:5;right:calc(clamp(10px,4vw,90px) + var(--cw) * .52);bottom:calc(var(--wallH) + var(--cw) * .43);background:#fff;border-radius:26px;padding:16px 22px;font-weight:1000;font-size:clamp(20px,1.7vw,28px);box-shadow:var(--sh2);display:flex;align-items:center;gap:12px;transform-origin:85% 100%;transition:transform .5s var(--spring),opacity .3s;cursor:pointer;white-space:nowrap}
.hbub::after{content:"";position:absolute;right:26px;bottom:-10px;width:22px;height:22px;background:#fff;transform:rotate(45deg);border-radius:4px}
.hbub.swap{transform:scale(.6) rotate(6deg);opacity:0}
.hbub:hover{transform:scale(1.06) rotate(-2deg)}
.hbub .spk{width:30px;height:30px;border-radius:50%;background:var(--o100);display:grid;place-items:center}
.hbub .spk svg{width:18px;height:18px}
.hbub.hide{opacity:0;transform:scale(.6)}

/* ===== Marquee ===== */
.marq{background:var(--ink);color:#fff;overflow:hidden;padding:26px 0;position:relative;z-index:4}
.marq .track{display:flex;gap:56px;width:max-content;animation:marq 38s linear infinite;align-items:center}
.marq:hover .track{animation-play-state:paused}
.marq .it{display:inline-flex;align-items:center;gap:16px;font-size:44px;font-weight:1000;letter-spacing:-1px;cursor:pointer;transition:color .2s,transform .4s var(--spring)}
.marq .it:hover{color:var(--sun);transform:scale(1.08) rotate(-2deg)}
.marq .it .flag{width:40px;height:40px;border-radius:50%}
.marq .dot{width:14px;height:14px;border-radius:50%;background:var(--o500);flex:none}
@keyframes marq{to{transform:translateX(-50%)}}

/* ===== Sections ===== */
.sec{position:relative;padding:150px clamp(40px,6vw,120px)}
.kick{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--o100);color:var(--o600);font-weight:1000;font-size:14px;letter-spacing:1.4px;text-transform:uppercase}
.h2x{font-size:clamp(52px,5.6vw,104px);font-weight:1000;letter-spacing:-.05em;line-height:.92;margin-top:22px}
.h2x em{font-style:normal;color:var(--o500)}
.lead{font-size:21px;font-weight:700;color:var(--ink2);line-height:1.5;max-width:620px;margin-top:22px}
.rv{opacity:0;transform:translateY(40px);transition:opacity .8s var(--soft),transform 1s var(--spring)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}.rv.d4{transition-delay:.4s}

/* --- try it now --- */
.try{display:grid;grid-template-columns:1fr 1.15fr;gap:80px;align-items:center}
.langpick{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.lp{display:inline-flex;align-items:center;gap:12px;padding:12px 20px 12px 12px;border-radius:999px;background:#fff;font-weight:900;font-size:18px;box-shadow:var(--sh1);transition:transform .35s var(--spring),background .2s,color .2s,box-shadow .3s}
.lp:hover{transform:translateY(-4px) rotate(-1.5deg);box-shadow:var(--sh2)}
.lp.on{background:var(--ink);color:#fff}
.lp .flag{width:34px;height:34px;border-radius:50%}
.lp .nat{font-weight:800;opacity:.55;font-size:15px}
.qcard{position:relative;background:#fff;border-radius:44px;padding:46px;box-shadow:var(--sh3)}
.qcard .qtop{display:flex;align-items:center;gap:16px}
.qcard .qbar{flex:1;height:14px;border-radius:99px;background:var(--o100);overflow:hidden}
.qcard .qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--o400),var(--o500));border-radius:99px;transition:width .6s var(--spring)}
.qcard .fishc{display:inline-flex;align-items:center;gap:6px;font-weight:1000;font-size:20px;color:var(--blue)}
.qcard .fishc .ico{width:30px;height:30px}
.qcard .qq{display:flex;align-items:center;gap:20px;margin-top:34px}
.qcard .qcat{width:120px;height:112px;flex:none}
.qcard .qbub{position:relative;background:var(--o50);border-radius:24px;padding:18px 24px;font-weight:900;font-size:22px;line-height:1.3}
.qcard .qbub::before{content:"";position:absolute;left:-9px;top:34px;width:20px;height:20px;background:var(--o50);transform:rotate(45deg);border-radius:3px}
.qcard .qbub .tw{font-size:34px;color:var(--o600);font-weight:1000;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.qcard .qbub .tw .ico{width:28px;height:28px}
.qcard .qbub .rom{display:block;font-size:15px;color:var(--mute);font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.opt{position:relative;height:150px;border-radius:28px;background:var(--cream);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font-size:64px;transition:transform .35s var(--spring),box-shadow .2s,background .2s;transform-style:preserve-3d}
.opt:hover{transform:translateY(-6px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 11px 0 var(--o200);background:#fff}
.opt .k{position:absolute;left:16px;top:14px;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);font-size:14px;font-weight:900;color:var(--mute);display:grid;place-items:center;background:#fff}
.opt.good{background:#E3F8EC;box-shadow:0 5px 0 #9BE0B8;animation:jelly .6s var(--spring)}
.opt.bad{background:#FFE7E8;box-shadow:0 5px 0 #F7B0B3;animation:shake .45s}
.opt.dim{opacity:.4}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.1,.9)}50%{transform:scale(.94,1.06)}70%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.qdone{text-align:center;padding:10px 0}
.qdone .big{font-size:56px;font-weight:1000;letter-spacing:-2px;line-height:1}
.qdone .big span{color:var(--blue)}
.plus{position:fixed;z-index:300;pointer-events:none;font-weight:1000;font-size:26px;color:var(--blue);display:flex;align-items:center;gap:4px;animation:plus 1s ease-out forwards}
.plus .ico{width:28px;height:28px}
@keyframes plus{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}

/* --- game loop --- */
.loop{background:var(--ink);color:#fff;border-radius:64px;margin:0 24px}
.loop .h2x{color:#fff}.loop .lead{color:rgba(255,255,255,.65)}
.loop .kick{background:rgba(255,255,255,.1);color:var(--sun)}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:70px}
.lc{position:relative;height:440px;border-radius:40px;padding:34px;overflow:hidden;color:var(--ink);transition:transform .5s var(--spring);display:flex;flex-direction:column}
.lc:hover{transform:translateY(-12px) rotate(var(--rot,-1.5deg))}
.lc:nth-child(2){--rot:1.5deg}.lc:nth-child(4){--rot:1.2deg}
.lc .n{font-size:15px;font-weight:1000;letter-spacing:1.5px;opacity:.55}
.lc h3{font-size:40px;font-weight:1000;letter-spacing:-1.5px;line-height:1;margin-top:10px}
.lc p{font-weight:800;font-size:17px;line-height:1.4;margin-top:12px;opacity:.78}
.lc .art{position:absolute;left:0;right:0;bottom:0;height:200px}
.lc.fish{background:#BFE5FF}.lc.trail{background:var(--sun)}.lc.league{background:#D9CCFF}.lc.stamp{background:#FFC4D9}
/* fish swim */
.lc.fish .f{position:absolute;width:70px;height:70px;transition:transform 1.4s var(--soft)}
.lc.fish .f:nth-child(1){left:20px;bottom:40px}.lc.fish .f:nth-child(2){left:120px;bottom:100px;width:54px;height:54px}.lc.fish .f:nth-child(3){left:200px;bottom:30px;width:84px;height:84px}
.lc.fish:hover .f:nth-child(1){transform:translate(160px,-30px) rotate(-10deg)}
.lc.fish:hover .f:nth-child(2){transform:translate(120px,20px)}
.lc.fish:hover .f:nth-child(3){transform:translate(110px,-50px) rotate(-14deg)}
.lc.fish .bub{position:absolute;width:14px;height:14px;border-radius:50%;border:3px solid rgba(255,255,255,.8);bottom:20px;opacity:0}
.lc.fish:hover .bub{animation:bubup 1.6s ease-out infinite}
.lc.fish .bub:nth-of-type(5){left:60px;animation-delay:.3s!important}.lc.fish .bub:nth-of-type(6){left:180px;animation-delay:.8s!important}
@keyframes bubup{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-140px)}}
/* trail */
.lc.trail .days{position:absolute;left:30px;right:30px;bottom:40px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.lc.trail .days i{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center;transition:background .3s,transform .4s var(--spring)}
.lc.trail .days i svg{width:70%;height:70%;opacity:0;transform:scale(.3) rotate(-30deg);transition:opacity .2s,transform .4s var(--spring)}
.lc.trail:hover .days i{background:#fff}
.lc.trail:hover .days i svg{opacity:1;transform:none}
.lc.trail .days i:nth-child(2) svg{transition-delay:.08s}.lc.trail .days i:nth-child(3) svg{transition-delay:.16s}.lc.trail .days i:nth-child(4) svg{transition-delay:.24s}.lc.trail .days i:nth-child(5) svg{transition-delay:.32s}.lc.trail .days i:nth-child(6) svg{transition-delay:.4s}.lc.trail .days i:nth-child(7) svg{transition-delay:.48s}
.lc.trail .cnt{position:absolute;right:30px;bottom:120px;font-size:84px;font-weight:1000;letter-spacing:-4px;line-height:1}
/* leagues */
.lc.league .pod{position:absolute;left:30px;right:30px;bottom:0;height:170px;display:flex;align-items:flex-end;gap:10px}
.lc.league .pod i{flex:1;border-radius:18px 18px 0 0;display:flex;justify-content:center;padding-top:10px;font-style:normal;font-weight:1000;color:#fff;font-size:22px;transition:height .6s var(--spring)}
.lc.league .pod i:nth-child(1){height:55%;background:#A9B4C2}.lc.league .pod i:nth-child(2){height:80%;background:var(--sun)}.lc.league .pod i:nth-child(3){height:40%;background:#D99A5B}
.lc.league:hover .pod i:nth-child(1){height:70%}.lc.league:hover .pod i:nth-child(2){height:100%}.lc.league:hover .pod i:nth-child(3){height:50%}
.lc.league .tro{position:absolute;left:50%;bottom:180px;width:64px;height:64px;margin-left:-32px;transition:transform .6s var(--spring)}
.lc.league:hover .tro{transform:translateY(-34px) rotate(-10deg) scale(1.2)}
.lc.league .tiers{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.lc.league .tiers span{font-size:12px;font-weight:1000;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.6)}
/* stamps */
.lc.stamp .st{position:absolute;width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 0 0 5px rgba(255,255,255,.5);transition:transform .5s var(--spring)}
.lc.stamp .st:nth-child(1){left:26px;bottom:34px;transform:rotate(-12deg)}.lc.stamp .st:nth-child(2){left:120px;bottom:90px;transform:rotate(8deg) scale(.85)}.lc.stamp .st:nth-child(3){right:26px;bottom:24px;transform:rotate(-4deg)}
.lc.stamp:hover .st:nth-child(1){animation:stampin .6s var(--spring)}.lc.stamp:hover .st:nth-child(2){animation:stampin .6s .12s var(--spring) backwards}.lc.stamp:hover .st:nth-child(3){animation:stampin .6s .24s var(--spring) backwards}
@keyframes stampin{0%{transform:scale(1.8) rotate(-30deg);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1) rotate(-6deg)}}

/* --- courses: the staircase --- */
.stairs{position:relative;height:620px;margin-top:80px}
.step{position:absolute;bottom:0;width:20%;border-radius:32px 32px 0 0;padding:26px 24px;color:#fff;transition:transform .45s var(--spring),filter .3s;cursor:pointer;display:flex;flex-direction:column}
.step:hover{transform:translateY(-10px)}
.step .lvl{font-size:56px;font-weight:1000;letter-spacing:-2px;line-height:1}
.step .nm{font-size:20px;font-weight:900;margin-top:4px}
.step .units{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px;opacity:.92}
.step .units span{display:flex;gap:8px;align-items:center}
.step .soon{margin-top:auto;align-self:flex-start;font-size:13px;font-weight:1000;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.28);letter-spacing:.5px}
.step .play{margin-top:auto;align-self:flex-start;font-size:15px;font-weight:1000;padding:10px 18px;border-radius:99px;background:#fff;color:var(--ink);transition:transform .3s var(--spring)}
.step:hover .play{transform:scale(1.08)}
.climber{position:absolute;width:170px;height:160px;z-index:3;pointer-events:none;transition:left .7s var(--soft),bottom .7s var(--spring)}
.climber .nk-fx{transform-origin:50% 100%}

/* --- meet neko: wardrobe --- */
.ward{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:40px;align-items:center;margin-top:60px}
.ward .stage{position:relative;height:520px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#fff 0 55%,transparent 56%)}
.ward .stage .host{position:absolute;left:8%;right:8%;top:6%;bottom:4%}
.ward h4{font-size:15px;font-weight:1000;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mood{padding:14px 10px;border-radius:20px;background:#fff;font-weight:900;font-size:15px;box-shadow:var(--sh1);transition:transform .3s var(--spring),background .2s,color .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.mood .mi{width:58px;height:54px}
.mood:hover,.mood.on{transform:translateY(-4px) scale(1.04);background:var(--ink);color:#fff}
.coats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.coat{position:relative;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06);transition:transform .35s var(--spring)}
.coat:hover{transform:scale(1.14) rotate(-8deg)}
.coat.on{box-shadow:0 0 0 4px var(--cream),0 0 0 7px var(--o500)}
.coat .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(6px);background:var(--ink);color:#fff;font-size:13px;font-weight:900;padding:6px 10px;border-radius:10px;white-space:nowrap;opacity:0;transition:.25s;pointer-events:none}
.coat:hover .tip{opacity:1;transform:translateX(-50%)}

/* --- bento features --- */
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:300px;gap:22px;margin-top:70px}
.bx{position:relative;border-radius:40px;padding:36px;overflow:hidden;background:#fff;box-shadow:var(--sh1);transition:transform .5s var(--spring),box-shadow .3s}
.bx:hover{transform:translateY(-6px);box-shadow:var(--sh3)}
.bx h3{font-size:34px;font-weight:1000;letter-spacing:-1.2px;line-height:1.02}
.bx p{font-weight:800;color:var(--ink2);margin-top:10px;font-size:16px;line-height:1.45;max-width:420px}
.bx.story{grid-column:span 4;grid-row:span 2;background:#E6F4FF}
.bx.listen{grid-column:span 2;background:var(--o100)}
.bx.match{grid-column:span 2;background:#E4F8EE}
.bx.cards{grid-column:span 3;background:#F1ECFF}
.bx.dict{grid-column:span 3;background:#FFF3CF}
.storybox{margin-top:30px;background:#fff;border-radius:30px;padding:30px 36px;font-size:30px;font-weight:900;line-height:1.6;box-shadow:var(--sh2)}
.gw{position:relative;display:inline-block;border-radius:10px;padding:0 4px;cursor:help;transition:background .2s,color .2s}
.gw:hover{background:var(--blue);color:#fff}
.gw .gl{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(8px) scale(.9);background:var(--ink);color:#fff;font-size:16px;line-height:1.3;padding:10px 14px;border-radius:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:.25s var(--spring);font-family:Nunito,sans-serif;font-weight:800;z-index:5}
.gw .gl b{display:block;color:var(--sun);font-size:13px}
.gw .gl::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.gw:hover .gl{opacity:1;transform:translateX(-50%)}
.storybox .en{display:block;font-size:18px;color:var(--mute);font-weight:800;margin-top:6px;line-height:1.4}
.bx .storycat{position:absolute;right:30px;top:24px;width:150px;height:140px}
.wave{display:flex;align-items:center;gap:5px;height:90px;margin-top:26px}
.wave i{flex:1;border-radius:99px;background:var(--o400);height:20%;transition:height .3s}
.bx.listen:hover .wave i{animation:wv .9s ease-in-out infinite;animation-delay:calc(var(--i) * -.09s)}
@keyframes wv{0%,100%{height:18%}50%{height:100%}}
.mtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}
.mtiles i{aspect-ratio:1;border-radius:16px;background:#fff;display:grid;place-items:center;font-style:normal;font-size:30px;transition:transform .5s var(--spring),background .3s;transform:rotateY(180deg)}
.mtiles i span{opacity:0;transition:opacity .2s .15s}.mtiles i b{position:absolute;font-size:26px;color:#9BD9B6;transition:opacity .15s .1s}.mtiles i{position:relative}.bx.match:hover .mtiles i b{opacity:0}
.bx.match:hover .mtiles i{transform:none}.bx.match:hover .mtiles i span{opacity:1}
.mtiles i:nth-child(2){transition-delay:.06s}.mtiles i:nth-child(3){transition-delay:.12s}.mtiles i:nth-child(4){transition-delay:.18s}
.fcard{position:absolute;right:40px;bottom:36px;width:240px;height:170px;perspective:900px}
.fcard .in{position:absolute;inset:0;transition:transform .7s var(--spring);transform-style:preserve-3d}
.bx.cards:hover .fcard .in{transform:rotateY(180deg)}
.fcard .fa,.fcard .fb{position:absolute;inset:0;border-radius:26px;background:#fff;display:grid;place-items:center;backface-visibility:hidden;box-shadow:var(--sh2);font-size:40px;font-weight:1000}
.fcard .fb{transform:rotateY(180deg);background:var(--lav);color:#fff;font-size:30px}
.fcard::before{content:"";position:absolute;inset:0;border-radius:26px;background:#fff;opacity:.5;transform:rotate(-8deg) translate(-14px,6px)}
.dsearch{margin-top:24px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:14px 20px;font-weight:900;font-size:18px;box-shadow:var(--sh1);max-width:420px}
.dsearch .ico{width:24px;height:24px}
.dsearch .typ{border-right:3px solid var(--o500);padding-right:2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}
.dres{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dres>span{background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;box-shadow:var(--sh1);transition:transform .3s var(--spring)}
.dres>span:hover{transform:translateY(-4px)}

/* --- final CTA --- */
.final{text-align:center;padding:160px 40px 120px;position:relative;overflow:hidden}
.final .h2x{font-size:clamp(70px,9vw,170px)}
.final .bedcat{width:460px;height:340px;margin:40px auto 0}
.final .mega{margin-top:30px}
.foot{display:flex;align-items:center;gap:30px;padding:40px clamp(40px,6vw,120px);border-top:2px solid var(--line);color:var(--ink2);font-weight:800}
.foot .sp{flex:1}
.foot a:hover{color:var(--o600)}

/* ===================== APP ===================== */
.app{display:grid;grid-template-columns:260px minmax(0,1fr) 360px;min-height:100vh;background:var(--cream)}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;display:flex;flex-direction:column;gap:6px;border-right:2px solid var(--line);background:var(--cream)}
.side .logo{font-size:28px;padding:0 12px 22px}
.side .ni{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;font-weight:900;font-size:17px;color:var(--ink2);transition:background .2s,color .2s,transform .3s var(--spring)}
.side .ni .ico{width:30px;height:30px;transition:transform .4s var(--spring)}
.side .ni:hover{background:var(--o50);color:var(--ink)}
.side .ni:hover .ico{transform:rotate(-10deg) scale(1.15)}
.side .ni.on{background:var(--o100);color:var(--o600)}
.side .sp{flex:1}
.side .mini{font-size:14px}
.main{min-width:0;padding:26px 40px 80px}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 26px 40px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.topbar .ttl{font-size:34px;font-weight:1000;letter-spacing:-1px;flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;background:#fff;font-weight:1000;font-size:17px;box-shadow:var(--sh1);transition:transform .3s var(--spring)}
.pill:hover{transform:translateY(-3px)}
.pill .ico{width:26px;height:26px}
.langdd{position:relative}
.langdd .menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:22px;box-shadow:var(--sh3);padding:8px;width:240px;z-index:40;opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:.25s var(--spring)}
.langdd:hover .menu,.langdd:focus-within .menu{opacity:1;transform:none;pointer-events:auto}
.langdd .menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;font-weight:900;text-align:left}
.langdd .menu button:hover{background:var(--o50)}
.langdd .menu button.on{background:var(--o100);color:var(--o600)}
.card{background:#fff;border-radius:28px;box-shadow:var(--sh1)}
.rail .card{padding:22px}
.rail h4{font-size:18px;font-weight:1000;display:flex;align-items:center;gap:8px}
.rail .buddy{position:relative;padding:20px 20px 0;background:var(--o100);overflow:hidden}
.rail .buddy .host{height:200px;margin-top:6px}
.rail .buddy .say{background:#fff;border-radius:18px;padding:12px 16px;font-weight:900;font-size:15px;line-height:1.35;position:relative}
.rail .buddy .say::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fff;transform:rotate(45deg);border-radius:2px}
.goal{display:flex;align-items:center;gap:18px}
.goal .ring{width:84px;height:84px;position:relative;flex:none}
.goal .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:1000}
.quest{display:flex;align-items:center;gap:12px;margin-top:14px}
.quest .ico{width:36px;height:36px}
.quest .qb{flex:1}
.quest .qb b{font-size:15px;font-weight:900}
.bar{height:10px;border-radius:99px;background:var(--o100);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--o400),var(--o500));transition:width .8s var(--spring)}
.bar.g>i{background:var(--green)}.bar.b>i{background:var(--blue)}.bar.p>i{background:var(--pink)}
.mini-lb .r{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:900}
.mini-lb .r .n{width:22px;color:var(--mute)}
.mini-lb .r.me{color:var(--o600)}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;display:block}
.av .avf,.avf{display:block;width:100%;height:100%;border-radius:50%}
.avf svg{width:100%;height:100%}

/* continue banner */
.cont{position:relative;display:flex;align-items:center;gap:30px;padding:36px 40px;border-radius:40px;color:#fff;overflow:hidden;min-height:250px}
.cont .t{flex:1;position:relative;z-index:2}
.cont .tag{display:inline-block;font-size:13px;font-weight:1000;letter-spacing:1px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.25)}
.cont h2{font-size:50px;font-weight:1000;letter-spacing:-2px;line-height:1;margin-top:12px}
.cont .skrow{display:flex;gap:10px;margin-top:22px}
.cont .sk{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:900;font-size:14px;transition:background .2s,transform .3s var(--spring)}
.cont .sk:hover{background:rgba(255,255,255,.35);transform:translateY(-3px)}
.cont .sk .ico{width:28px;height:28px;background:#fff;border-radius:50%;padding:4px}
.cont .sk.done{background:#fff;color:var(--ink)}
.cont .cc{width:260px;height:240px;position:relative;z-index:2;flex:none}
.cont::before{content:"";position:absolute;right:-60px;top:-80px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.14)}
.cont .btn{background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.15);margin-top:24px}
.lvsec{margin-top:46px}
.lvsec .lh{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.lvsec .lh .badge{font-size:16px;font-weight:1000;color:#fff;padding:6px 12px;border-radius:12px}
.lvsec .lh h3{font-size:26px;font-weight:1000;letter-spacing:-.5px}
.lvsec .lh .pct{margin-left:auto;font-weight:900;color:var(--mute)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.uc{position:relative;height:230px;border-radius:30px;padding:22px;color:#fff;text-align:left;overflow:hidden;transition:transform .45s var(--spring),box-shadow .3s;display:flex;flex-direction:column}
.uc:hover{transform:translateY(-8px) rotate(-1.5deg);box-shadow:0 20px 40px -12px rgba(0,0,0,.25)}
.uc .un{font-size:14px;font-weight:1000;opacity:.8;letter-spacing:.5px}
.uc .nm{font-size:24px;font-weight:1000;letter-spacing:-.5px;line-height:1.05;margin-top:4px;max-width:80%}
.uc .em{position:absolute;right:16px;top:16px;font-size:30px;transition:transform .5s var(--spring)}
.uc:hover .em{transform:scale(1.3) rotate(-14deg)}
.uc .ucat{position:absolute;right:-6px;bottom:30px;width:120px;height:110px;transition:transform .5s var(--spring)}
.uc:hover .ucat{transform:translateY(-8px) scale(1.06)}
.uc .ub{margin-top:auto;position:relative;z-index:2}
.uc .ub .bar{background:rgba(255,255,255,.3)}.uc .ub .bar>i{background:#fff}
.uc .ub small{font-weight:900;font-size:13px;opacity:.9}
.uc.lock{background:#E9DFD5!important;color:var(--mute);cursor:default}
.uc.lock:hover{transform:none;box-shadow:none}
.uc.lock .ucat{opacity:.45;filter:grayscale(1)}
.uc .lk{position:absolute;right:16px;top:16px;width:30px;height:30px}

/* modal / unit drawer */
.ov{position:fixed;inset:0;z-index:100;background:rgba(58,42,32,.42);backdrop-filter:blur(4px);display:grid;place-items:center;opacity:0;transition:opacity .25s;padding:30px}
.ov.show{opacity:1}
.ov .mdl{background:var(--cream);border-radius:40px;width:min(880px,100%);max-height:calc(100vh - 60px);overflow:auto;padding:40px;transform:translateY(30px) scale(.96);transition:transform .45s var(--spring);position:relative}
.ov.show .mdl{transform:none}
.mdl .x{position:absolute;right:22px;top:22px;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh1);transition:transform .3s var(--spring)}
.mdl .x:hover{transform:rotate(90deg)}
.mdl .x .ico{width:26px;height:26px}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.skb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px;border-radius:26px;background:#fff;box-shadow:var(--sh1);text-align:left;transition:transform .35s var(--spring),box-shadow .3s}
.skb:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.skb .ico{width:48px;height:48px;padding:8px;border-radius:16px}
.skb b{font-size:20px;font-weight:1000}
.skb small{font-weight:800;color:var(--mute);font-size:14px}
.skb .dn{position:absolute;right:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--green);padding:5px}
.wchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.wchip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;font-weight:900;font-size:17px;box-shadow:var(--sh1);transition:transform .3s var(--spring),background .2s}
.wchip:hover{transform:translateY(-3px);background:var(--o100)}
.wchip .tr{display:none;font-weight:800;color:var(--ink2);font-size:14px}
.wchip:hover .tr{display:inline}

/* lesson player */
.lesson{position:fixed;inset:0;z-index:120;background:var(--cream);display:flex;flex-direction:column}
.lesson .lt{display:flex;align-items:center;gap:22px;padding:28px max(40px,calc(50% - 520px))}
.lesson .lt .x{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .3s var(--spring)}
.lesson .lt .x:hover{background:var(--o100);transform:rotate(90deg)}
.lesson .lt .bar{flex:1;height:18px;margin:0}
.lesson .combo{display:inline-flex;align-items:center;gap:6px;font-weight:1000;color:var(--o500);font-size:20px;min-width:70px;transition:transform .3s var(--spring)}
.lesson .combo.pop{animation:jelly .5s}
.lesson .combo .ico{width:30px;height:30px}
.lesson .lb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px 40px;overflow:auto}
.lesson .lbin{width:min(980px,100%)}
.lesson .qhead{display:flex;align-items:center;gap:26px}
.lesson .qhead .lc2{width:150px;height:140px;flex:none}
.lesson .qhead .qp{position:relative;background:#fff;border-radius:30px;padding:24px 30px;box-shadow:var(--sh1);flex:1}
.lesson .qhead .qp::before{content:"";position:absolute;left:-10px;top:40px;width:22px;height:22px;background:#fff;transform:rotate(45deg);border-radius:4px}
.lesson .qhead .qk{font-size:15px;font-weight:1000;color:var(--mute);letter-spacing:1px;text-transform:uppercase}
.lesson .qhead .qt{font-size:34px;font-weight:1000;letter-spacing:-.5px;line-height:1.25;margin-top:6px}
.lesson .qhead .qt .tw{color:var(--o600)}
.lesson .qhead .qt .blank{display:inline-block;min-width:120px;border-bottom:4px solid var(--o300);margin:0 6px}
.lesson .qhead .qs{font-size:17px;font-weight:800;color:var(--mute);margin-top:6px}
.spkbtn{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:22px;background:var(--blue);box-shadow:0 5px 0 #1F86CF;vertical-align:middle;transition:transform .3s var(--spring)}
.spkbtn:hover{transform:translateY(-3px) scale(1.05)}
.spkbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1F86CF}
.spkbtn .ico{width:36px;height:36px}
.spkbtn.big{width:120px;height:120px;border-radius:36px}.spkbtn.big .ico{width:64px;height:64px}
.spkbtn.playing{animation:jelly .6s}
.lesson .opts{grid-template-columns:repeat(4,1fr);margin-top:40px;gap:18px}
.lesson .opts.txt{grid-template-columns:1fr 1fr}
.lesson .opt{height:200px;font-size:84px}
.lesson .opts.txt .opt{height:110px;font-size:28px;font-weight:1000;padding:0 60px;text-align:center;line-height:1.2}
.lesson .opt .sm{display:block;font-size:14px;color:var(--mute);font-weight:800}
.lesson .opt.sel{background:#E9F6FF;box-shadow:0 5px 0 #9ED2F7;transform:translateY(-4px)}
.picnum{font-size:96px;font-weight:1000;color:var(--o500)}
.picsw{width:96px;height:96px;border-radius:28px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
.lesson .lf{border-top:2px solid var(--line);padding:26px max(40px,calc(50% - 520px));display:flex;align-items:center;gap:20px;transition:background .3s}
.lesson .lf .msg{flex:1;display:flex;align-items:center;gap:18px}
.lesson .lf .msg .fc{width:84px;height:78px}
.lesson .lf .msg b{font-size:26px;font-weight:1000;display:block}
.lesson .lf .msg span{font-weight:800;font-size:17px}
.lesson .lf.good{background:#DDF7E8;color:#1E8B52}
.lesson .lf.bad{background:#FFE3E4;color:#C4373E}
.lesson .lf .hint{font-weight:900;color:var(--mute);font-size:14px}
.lesson .lf .hint kbd,.kbd{font-family:inherit;font-size:13px;font-weight:900;padding:3px 8px;border-radius:7px;background:#fff;border:2px solid var(--line);color:var(--ink2)}
.res{text-align:center}
.res .rc{width:300px;height:280px;margin:0 auto}
.res h2{font-size:64px;font-weight:1000;letter-spacing:-2.5px}
.res .stats{display:flex;justify-content:center;gap:16px;margin-top:28px}
.res .stats div{background:#fff;border-radius:24px;padding:18px 28px;min-width:160px;box-shadow:var(--sh1)}
.res .stats b{display:flex;align-items:center;justify-content:center;gap:8px;font-size:34px;font-weight:1000}
.res .stats b .ico{width:34px;height:34px}
.res .stats small{font-weight:900;color:var(--mute);font-size:14px;letter-spacing:.5px;text-transform:uppercase}

/* practice */
.prgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.prc{position:relative;border-radius:36px;padding:34px;min-height:260px;text-align:left;overflow:hidden;transition:transform .45s var(--spring);display:flex;flex-direction:column;gap:8px}
.prc:hover{transform:translateY(-8px) rotate(-1deg)}
.prc h3{font-size:34px;font-weight:1000;letter-spacing:-1px}
.prc p{font-weight:800;color:var(--ink2);max-width:300px;line-height:1.45}
.prc .pc{position:absolute;right:20px;bottom:10px;width:170px;height:160px}
.prc .btn{align-self:flex-start;margin-top:auto}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.mt{height:130px;border-radius:24px;background:#fff;box-shadow:0 5px 0 var(--line);font-size:26px;font-weight:1000;display:grid;place-items:center;transition:transform .3s var(--spring),background .2s,opacity .4s,box-shadow .2s;text-align:center;padding:10px}
.mt.e{font-size:56px}
.mt:hover{transform:translateY(-5px);box-shadow:0 10px 0 var(--o200)}
.mt.sel{background:#E9F6FF;box-shadow:0 5px 0 #9ED2F7}
.mt.ok{background:#DDF7E8;box-shadow:none;opacity:0;transform:scale(.8);pointer-events:none;transition-delay:.35s}
.mt.no{animation:shake .4s;background:#FFE3E4}
.flash{perspective:1400px;width:min(560px,100%);height:360px;margin:30px auto 0;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .7s var(--spring);transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .fa,.flash .fb{position:absolute;inset:0;border-radius:40px;background:#fff;box-shadow:var(--sh3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;backface-visibility:hidden}
.flash .fa .w{font-size:64px;font-weight:1000}
.flash .fa .r{font-size:20px;color:var(--mute);font-weight:800}
.flash .fb{transform:rotateY(180deg);background:var(--lav);color:#fff}
.flash .fb .e{font-size:110px;line-height:1}
.flash .fb .w{font-size:38px;font-weight:1000}
.fnav{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:30px;font-weight:900}

/* stories */
.books{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.book{position:relative;border-radius:36px;padding:30px;min-height:300px;color:#fff;text-align:left;overflow:hidden;transition:transform .5s var(--spring)}
.book:hover{transform:translateY(-8px) rotate(-1.5deg)}
.book h3{font-size:40px;font-weight:1000;letter-spacing:-1.5px;line-height:1;max-width:60%}
.book .bc{position:absolute;right:10px;bottom:0;width:220px;height:200px}
.reader{background:#fff;border-radius:40px;padding:50px 56px;box-shadow:var(--sh2)}
.reader .pg{display:flex;flex-direction:column;gap:22px}
.reader .sent{font-size:34px;font-weight:900;line-height:1.55;border-radius:16px;padding:4px 10px;margin:0 -10px;transition:background .2s}
.reader .sent:hover{background:var(--o50)}
.reader .sent .en{display:block;font-size:17px;color:var(--mute);font-weight:800;line-height:1.4}
.reader.hideen .sent .en{display:none}
.reader .sent.speaking{background:var(--o100)}
.reader .rnav{display:flex;align-items:center;gap:16px;margin-top:40px}
.reader .dots{flex:1;display:flex;gap:8px;justify-content:center}
.reader .dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:.3s}
.reader .dots i.on{background:var(--o500);width:34px;border-radius:6px}
.rhead{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.rhead .pcat{width:110px;height:100px}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:900;cursor:pointer}
.toggle i{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--spring)}
.toggle.on i{background:var(--green)}.toggle.on i::after{transform:translateX(20px)}

/* dictionary */
.search{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:0 24px;height:64px;box-shadow:var(--sh1);font-size:20px;font-weight:900}
.search input{flex:1;border:0;outline:0;background:none;font-weight:900}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:24px}
.dc{height:170px;perspective:900px;cursor:pointer}
.dc .in{position:relative;width:100%;height:100%;transition:transform .6s var(--spring);transform-style:preserve-3d}
.dc:hover .in{transform:rotateY(180deg)}
.dc .fa,.dc .fb{position:absolute;inset:0;border-radius:26px;background:#fff;box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:12px;text-align:center}
.dc .fa .w{font-size:26px;font-weight:1000;line-height:1.15}
.dc .fa .r{font-size:14px;color:var(--mute);font-weight:800}
.dc .fb{transform:rotateY(180deg);background:var(--o500);color:#fff}
.dc .fb .e{font-size:52px;line-height:1.1}.dc .fb .e .picnum{font-size:52px;color:#fff}.dc .fb .e .picsw{width:52px;height:52px;border-radius:16px}
.dc .fb .w{font-weight:1000;font-size:18px;margin-top:4px}

/* leagues */
.tiers{display:flex;gap:14px}
.tier{flex:1;border-radius:26px;padding:20px;text-align:center;font-weight:1000;color:#fff;transition:transform .35s var(--spring);opacity:.5}
.tier.on{opacity:1;transform:scale(1.06)}
.tier:hover{transform:translateY(-5px) scale(1.04);opacity:1}
.tier .ico{width:46px;height:46px;display:block;margin:0 auto 6px}
.lbt{margin-top:26px;background:#fff;border-radius:32px;padding:14px;box-shadow:var(--sh1)}
.lbr{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:20px;font-weight:900;font-size:18px;transition:background .2s,transform .3s var(--spring)}
.lbr:hover{background:var(--o50);transform:translateX(6px)}
.lbr .rk{width:36px;font-size:20px;color:var(--mute);text-align:center}
.lbr .av{width:48px;height:48px}
.lbr .nm{flex:1}
.lbr .xp{display:flex;align-items:center;gap:6px;color:var(--blue)}
.lbr .xp .ico{width:24px;height:24px}
.lbr.me{background:var(--o100)}
.lbr.zone{border-top:2px dashed var(--green);margin-top:8px;padding-top:18px}

/* profile */
.prof{display:grid;grid-template-columns:380px 1fr;gap:26px}
.pcard{background:#fff;border-radius:36px;padding:30px;box-shadow:var(--sh1);text-align:center}
.pcard .pav{width:240px;height:230px;margin:0 auto;border-radius:50%;background:var(--o100);position:relative;overflow:hidden}
.pcard .pav .host{position:absolute;left:8%;right:8%;top:10%;bottom:0}
.pcard input.nm{font-size:30px;font-weight:1000;text-align:center;border:0;outline:0;background:none;width:100%;margin-top:16px;border-radius:12px;padding:4px}
.pcard input.nm:hover,.pcard input.nm:focus{background:var(--o50)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sbox{background:#fff;border-radius:24px;padding:20px;box-shadow:var(--sh1)}
.sbox b{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:1000}
.sbox b .ico{width:30px;height:30px}
.sbox small{font-weight:900;color:var(--mute);font-size:13px;letter-spacing:.4px;text-transform:uppercase}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px}
.stp{position:relative;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:var(--sh1);transition:transform .4s var(--spring)}
.stp.off{filter:grayscale(1);opacity:.35}
.stp:hover{transform:scale(1.1) rotate(-8deg);filter:none;opacity:1}
.stp .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(6px);background:var(--ink);color:#fff;font-size:13px;font-weight:900;padding:8px 12px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.25s;z-index:3;text-align:center;line-height:1.3}
.stp:hover .tip{opacity:1;transform:translateX(-50%)}
.coats.shop{grid-template-columns:repeat(7,1fr)}
.coat .pr{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#fff;border-radius:99px;padding:2px 8px 2px 4px;font-size:12px;font-weight:1000;display:flex;align-items:center;gap:3px;box-shadow:var(--sh1)}
.coat .pr .ico{width:16px;height:16px}
.sh{font-size:22px;font-weight:1000;margin:34px 0 4px;letter-spacing:-.3px}

/* toast + confetti */
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-160%);background:var(--ink);color:#fff;border-radius:999px;padding:14px 24px;font-weight:900;font-size:16px;box-shadow:var(--sh3);z-index:400;transition:transform .5s var(--spring);display:flex;align-items:center;gap:10px}
.toast.show{transform:translate(-50%,0)}
.toast .ico{width:24px;height:24px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:450;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* cursor buddy: a little yarn ball trailing the mouse on the site */
.yarnc{position:fixed;left:0;top:0;width:26px;height:26px;pointer-events:none;z-index:500;opacity:0;transition:opacity .3s}
.yarnc.on{opacity:1}
@media (max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr)}.rail{display:none}.lgrid{grid-template-columns:1fr 1fr}.ward{grid-template-columns:1fr}.try{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.marq .track{animation:none}}

.wall .note{position:absolute;left:clamp(40px,5.5vw,110px);bottom:20px;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;gap:12px;opacity:.95}.wall .note .flag{width:26px;height:26px;border-radius:50%;margin-right:-8px;box-shadow:0 0 0 2px var(--o500);transition:transform .3s var(--spring)}.wall .note .flag:hover{transform:translateY(-5px) scale(1.2)}.wall .note .fl{display:flex;margin-right:8px}
.rail>*{flex:none}
.lesson .opt{background:#fff}
.lesson .opt:hover{background:#fff}
.prof{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
.prof .sgrid{grid-template-columns:repeat(2,1fr)}
.prof .stamps{grid-template-columns:repeat(6,1fr)}
.prof .coats.shop{grid-template-columns:repeat(7,1fr);gap:12px}
.pcard .pav{width:220px;height:210px}
@media (min-width:1600px){.prof .sgrid{grid-template-columns:repeat(4,1fr)}}
.book h3{max-width:58%;font-size:44px}

.nk{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;--lx:0;--ly:0;user-select:none;-webkit-user-select:none}
.nk-move,.nk-fx{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%}
.nk-move{transition:transform 2.6s cubic-bezier(.45,0,.55,1)}
.neko{display:block;width:100%;height:100%;overflow:visible}
.neko.n5{filter:drop-shadow(0 1.6px 1.6px rgba(90,55,20,.16))}
.n5 .n5-body{fill:var(--c)}
.n5 .n5-tail{fill:var(--t)}
.n5 .n5-ft path{fill:var(--k)}
.n5 .n5-bl ellipse{fill:var(--b);opacity:.92}
.n5 .n5-sh{fill:rgba(90,60,30,.11)}
.n5 .n5-arm,.n5 .n5-pawb{fill:var(--c);stroke:rgba(40,20,10,.13);stroke-width:1.5}
.n5 .n5-pad{fill:var(--b)}
.n5 .n5-tongue{fill:#EF7187;transform-box:fill-box;transform-origin:50% 0}
.n5 .fx{transform-box:fill-box;transform-origin:50% 50%}
.n5 .fx-r{fill:#E0574F}.n5 .fx-b{fill:#8CC8E8}.n5 .fx-g{fill:#F2B544}.n5 .fx-p{fill:#E9E0D3}
/* always-on life: slow breathing, a little tail sway, blinking */
.n5 .n5-all{transform-box:view-box;transform-origin:100px 186px;animation:n5br 4.4s ease-in-out infinite}
.n5 .n5-tilt{transform-box:view-box;transform-origin:100px 186px}
.n5 .n5-tail{transform-box:fill-box;transform-origin:85% 40%;animation:n5tail 3.8s ease-in-out infinite}
.n5 .n5-face{transform:translate(calc(var(--lx,0) * 4.5px),calc(var(--ly,0) * 3px));transition:transform .8s cubic-bezier(.45,0,.25,1)}
.n5 .n5-ft,.n5 .n5-bl,.n5 .n5-pawh{transform-box:fill-box;transform-origin:50% 50%;transition:opacity .17s ease,transform .17s ease}
.n5 .n5-face.shut .n5-ft{opacity:0;transform:scaleY(.5)}
.n5 .n5-face.shut .n5-bl,.n5 .n5-pawh.shut{opacity:0}
.n5 .eg{transform-box:fill-box;transform-origin:50% 50%;transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.n5.sus .eg{transform:scale(1.45)}
.n5 .eb{transform-box:fill-box;transform-origin:50% 50%;animation:n5blink 5.6s ease-in-out infinite;transition:transform .07s ease}
.n5 .eg+.eg .eb{animation-delay:.05s}
.n5w .n5 .eb{animation:none}
.n5.blk .eb{transform:scaleY(.08)}
.n5 .n5-ft .hl{fill:#fff;opacity:.95}
.n5 .el{transition:transform .45s cubic-bezier(.45,0,.25,1);transform:translate(calc(var(--lx,0) * 1.3px),calc(var(--ly,0) * 1.1px))}
@keyframes n5br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.013,.986)}}
@keyframes n5tail{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-1.4px,-.8px) rotate(-6deg)}}
@keyframes n5blink{0%,92%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.1)}}
/* effects come in softly, then keep a slow loop of their own */
.n5-fx.in{transform-box:view-box;transform-origin:118px 82px;animation:n5in .6s cubic-bezier(.2,.9,.3,1.2) both}
.n5-fx.out{opacity:0;transition:opacity .28s ease}
@keyframes n5in{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
.p-love .fx,.pz-love .fx{animation:n5float 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.8s)}
.p-confused .fx,.pz-confused .fx{transform-origin:50% 100%;animation:n5wob 2.6s ease-in-out infinite}
.p-angry .fx,.pz-angry .fx{animation:n5pulse 1.4s ease-in-out infinite}
.p-surprised .fx,.pz-surprised .fx{transform-origin:50% 100%;animation:n5bob 1.9s ease-in-out infinite}
.p-sleep .fx,.pz-sleep .fx,.p-flop .fx,.p-flop2 .fx,.p-flopL .fx{opacity:0;animation:n5zz 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * .6s)}
.p-delighted .fx,.pz-delighted .fx{animation:n5tw 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.5s)}
.p-meh .fx,.p-phew .fx,.pz-meh .fx,.pz-phew .fx{transform-origin:0 50%;animation:n5puff 3.4s ease-out infinite}
.p-cry .fx,.pz-cry .fx{animation:n5shine 2.4s ease-in-out infinite}
.p-nervous .fx,.pz-nervous .fx{animation:n5sweat 3s ease-in-out infinite}
@keyframes n5float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.07)}}
@keyframes n5wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg) translateY(-1px)}}
@keyframes n5pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes n5bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes n5zz{0%{opacity:0;transform:translate(-3px,4px) scale(.7)}25%,70%{opacity:1}100%{opacity:0;transform:translate(4px,-6px) scale(1.08)}}
@keyframes n5tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.62) rotate(18deg);opacity:.6}}
@keyframes n5puff{0%{opacity:0;transform:translateX(-6px) scale(.6)}22%{opacity:1}70%{opacity:1;transform:translateX(2px) scale(1)}100%{opacity:0;transform:translateX(8px) scale(1.1)}}
@keyframes n5shine{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes n5sweat{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
/* how the body moves in each mood: slow and soft */
.p-happy .n5-tilt{animation:n5sway 3.4s ease-in-out infinite}
.p-delighted .n5-tilt{animation:n5hop 1.8s ease-in-out infinite}
.p-love .n5-tilt{animation:n5sway 4s ease-in-out infinite}
.p-cry .n5-tilt{animation:n5sob 1.8s ease-in-out infinite}
.p-angry .n5-tilt{animation:n5huff 1.4s ease-in-out infinite}
.p-nervous .n5-tilt{animation:n5fidget 2.2s ease-in-out infinite}
.p-sleep .n5-tilt,.p-flop .n5-tilt,.sc-bed .n5-tilt,.sc-blanket .n5-tilt{animation:n5sleep 4.8s ease-in-out infinite}
.p-lick .n5-tilt{animation:n5headbob 1.25s ease-in-out infinite}
@keyframes n5sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes n5hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-2.5%) scale(.99,1.01)}60%{transform:translateY(0) scale(1.02,.98)}}
@keyframes n5sob{0%,100%{transform:scale(1)}50%{transform:scale(1.018,.972)}}
@keyframes n5huff{0%,100%{transform:scale(1)}50%{transform:scale(1.025,.985)}}

    ["Heute regnet es.","Mia schaut aus dem Fenster.","Der Himmel ist grau, aber Mia ist froh.","Sie liebt das Geräusch vom Regen."],
    ["Mia hat einen roten Regenschirm.","Sie zieht ihre gelben Stiefel an.","Dann nimmt sie ihre Tasche und ihr Buch.","Mia sagt: Ich bin fertig!"],
    ["Mia geht zum Café.","Das Café ist klein und gemütlich.","Sie trinkt einen heißen Kaffee und isst etwas Brot.","Eine Katze schläft am Fenster."],
    ["Ihr Freund Ken kommt herein.","Ken sagt: Guten Morgen, Mia!","Ken ist nass, denn er hat keinen Regenschirm.","Er setzt sich neben Mia."],
    ["Mia lacht und gibt Ken ein Handtuch.","Sie trinken zusammen Tee.","Sie sprechen über Bücher und Musik.","Die Katze wacht auf und hört zu."],
    ["Nach einer Stunde hört der Regen auf.","Die Sonne kommt heraus.","Mia und Ken gehen nach draußen.","Hallo, Sonne! Was für ein schöner Morgen!"]],
   ar:[
    ["اليوم تمطر.","تنظر ميا من النافذة.","السماء رمادية، لكن ميا سعيدة.","هي تحب صوت المطر."],
    ["عند ميا مظلة حمراء.","تلبس حذاءها الأصفر.","ثم تأخذ حقيبتها وكتابها.","تقول ميا: أنا جاهزة!"],
    ["تمشي ميا إلى المقهى.","المقهى صغير ودافئ.","تشرب قهوة ساخنة وتأكل بعض الخبز.","قطة تنام قرب النافذة."],
    ["يدخل صديقها كين.","يقول كين: صباح الخير يا ميا!","كين مبلل، لأنه ليس عنده مظلة.","يجلس بجانب ميا."],
    ["تضحك ميا وتعطي كين منشفة.","يشربان الشاي معا.","يتكلمان عن الكتب والموسيقى.","تستيقظ القطة وتستمع."],
    ["بعد ساعة، يتوقف المطر.","تخرج الشمس.","تخرج ميا وكين.","مرحبا يا شمس! يا له من صباح جميل!"]]}},
 {scenes:["sun","basket","tree","tree","dog","heart"],moods:["happy","playful","idle","love","confused","happy"],
  title:{"en":"The picnic","ja":"ピクニック","es":"El pícnic","fr":"Le pique-nique","de":"Das Picknick","ar":"النزهة"},
  pages:{
   en:[
    ["It is a sunny Sunday.","Mia and Ken want to have a picnic.","They pack a big basket.","Mia makes sandwiches in the kitchen."],
    ["In the basket, there is bread, cheese and apples.","There is cold juice too.","Ken carries the basket.","It is very heavy!"],
    ["They walk to the park.","The trees are green and the flowers are pink.","Birds sing in the sky.","Children play with a red ball."],
    ["They sit under a big tree.","Mia opens the basket.","Everything looks delicious!","They eat slowly and look at the clouds."],
    ["Suddenly, a little dog runs to them.","It wants some bread!","Ken gives the dog a small piece.","Then the dog sits and waits."],
    ["The dog is very happy.","A girl calls, Momo! Come here!","Everyone laughs.","What a fun day in the park!"]],
   ja:[
    ["きょうは はれの にちようびです。","ミアと ケンは ピクニックを したいです。","おおきな バスケットに じゅんびを します。","ミアは だいどころで サンドイッチを つくります。"],
    ["バスケットには パンと チーズと りんごが あります。","つめたい ジュースも あります。","ケンが バスケットを もちます。","とても おもいです！"],
    ["ふたりは こうえんまで あるきます。","きは みどりで、はなは ピンクです。","とりが そらで うたって います。","こどもたちが あかい ボールで あそんで います。"],
    ["おおきな きの したに すわります。","ミアが バスケットを あけます。","ぜんぶ おいしそう！","ふたりは ゆっくり たべて、くもを みます。"],
    ["とつぜん、ちいさい いぬが はしって きます。","いぬは パンが ほしいのです！","ケンは いぬに パンを すこし あげます。","それから いぬは すわって まちます。"],
    ["いぬは とても うれしそうです。","おんなのこが モモ、おいで！と よびます。","みんな わらいます。","こうえんで たのしい いちにちでした！"]],
   es:[
    ["Es un domingo de sol.","Mia y Ken quieren hacer un pícnic.","Preparan una cesta grande.","Mia hace sándwiches en la cocina."],
    ["En la cesta hay pan, queso y manzanas.","También hay zumo frío.","Ken lleva la cesta.","¡Es muy pesada!"],
    ["Caminan al parque.","Los árboles son verdes y las flores son rosas.","Los pájaros cantan en el cielo.","Unos niños juegan con una pelota roja."],
    ["Se sientan bajo un árbol grande.","Mia abre la cesta.","¡Todo parece delicioso!","Comen despacio y miran las nubes."],
    ["De repente, un perrito corre hacia ellos.","¡Quiere pan!","Ken le da un trocito al perro.","Luego el perro se sienta y espera."],
    ["El perro está muy contento.","Una niña lo llama: ¡Momo, ven aquí!","Todos se ríen.","¡Qué día tan divertido en el parque!"]],
   fr:[
    ["C’est un dimanche ensoleillé.","Mia et Ken veulent faire un pique-nique.","Ils préparent un grand panier.","Mia fait des sandwichs dans la cuisine."],
    ["Dans le panier, il y a du pain, du fromage et des pommes.","Il y a aussi du jus frais.","Ken porte le panier.","Il est très lourd !"],
    ["Ils marchent jusqu’au parc.","Les arbres sont verts et les fleurs sont roses.","Les oiseaux chantent dans le ciel.","Des enfants jouent avec un ballon rouge."],
    ["Ils s’assoient sous un grand arbre.","Mia ouvre le panier.","Tout a l’air délicieux !","Ils mangent lentement et regardent les nuages."],
    ["Soudain, un petit chien court vers eux.","Il veut du pain !","Ken donne un petit morceau au chien.","Puis le chien s’assoit et attend."],
    ["Le chien est très content.","Une fille l’appelle : Momo, viens ici !","Tout le monde rit.","Quelle belle journée au parc !"]],
   de:[
    ["Es ist ein sonniger Sonntag.","Mia und Ken wollen ein Picknick machen.","Sie packen einen großen Korb.","Mia macht Sandwiches in der Küche."],
    ["Im Korb sind Brot, Käse und Äpfel.","Es gibt auch kalten Saft.","Ken trägt den Korb.","Er ist sehr schwer!"],
    ["Sie gehen in den Park.","Die Bäume sind grün und die Blumen sind rosa.","Die Vögel singen am Himmel.","Kinder spielen mit einem roten Ball."],
    ["Sie setzen sich unter einen großen Baum.","Mia öffnet den Korb.","Alles sieht lecker aus!","Sie essen langsam und schauen die Wolken an."],
    ["Plötzlich läuft ein kleiner Hund zu ihnen.","Er will Brot!","Ken gibt dem Hund ein kleines Stück.","Dann setzt sich der Hund und wartet."],
    ["Der Hund ist sehr glücklich.","Ein Mädchen ruft: Momo, komm her!","Alle lachen.","Was für ein schöner Tag im Park!"]],
   ar:[
    ["اليوم يوم أحد مشمس.","ميا وكين يريدان نزهة.","يجهزان سلة كبيرة.","ميا تصنع السندويشات في المطبخ."],
    ["في السلة خبز وجبن وتفاح.","وفيها أيضا عصير بارد.","كين يحمل السلة.","إنها ثقيلة جدا!"],
    ["يمشيان إلى الحديقة.","الأشجار خضراء والزهور وردية.","العصافير تغني في السماء.","يلعب الأطفال بكرة حمراء."],
    ["يجلسان تحت شجرة كبيرة.","تفتح ميا السلة.","كل شيء يبدو لذيذا!","يأكلان ببطء وينظران إلى الغيوم."],
    ["فجأة، يركض كلب صغير نحوهما.","يريد الخبز!","يعطي كين الكلب قطعة صغيرة.","ثم يجلس الكلب وينتظر."],
    ["الكلب سعيد جدا.","تنادي بنت: مومو، تعال هنا!","الجميع يضحكون.","يا له من يوم ممتع في الحديقة!"]]}}
];

const nkSpl='.45 0 .35 1';
/* keys: [[seconds,value,spline?],...] from 0 to T */
function nkA(attr,keys,T,{lin=0,add=''}={}){if(NK_RM())return '';
 return `<animate attributeName="${attr}" dur="${T}s" repeatCount="indefinite" keyTimes="${keys.map(k=>(k[0]/T).toFixed(4)).join(';')}" values="${keys.map(k=>k[1]).join(';')}"${lin?' calcMode="linear"':` calcMode="spline" keySplines="${keys.slice(1).map(k=>k[2]||nkSpl).join(';')}"`}${add}/>`}
function nkAT(type,keys,T,add=''){if(NK_RM())return '';
 return `<animateTransform attributeName="transform" type="${type}" dur="${T}s" repeatCount="indefinite" keyTimes="${keys.map(k=>(k[0]/T).toFixed(4)).join(';')}" values="${keys.map(k=>k[1]).join(';')}" calcMode="spline" keySplines="${keys.slice(1).map(k=>k[2]||nkSpl).join(';')}"${add}/>`}
/* opacity keys for something shown during [on,off] windows, fading over f seconds */
function nkShow(wins,T,f=.25){const k=[[0,0]];wins.forEach(([a,b])=>{k.push([Math.max(0,a-f/2),0],[Math.min(T,a+f/2),1],[Math.max(0,b-f/2),1],[Math.min(T,b+f/2),0])});k.push([T,0]);
 const out=[];k.sort((x,y)=>x[0]-y[0]).forEach(p=>{if(out.length&&Math.abs(out[out.length-1][0]-p[0])<1e-4)out[out.length-1]=p;else out.push(p)});
 if(wins.some(([a])=>a<=0)){out[0]=[0,1]}if(wins.some(([,b])=>b>=T)){out[out.length-1]=[T,1]}return out}

/* ======================================================================
   Soft-body Neko (v2): the same simple flat cat, but the outline bends
   like jelly. Three underdamped springs drive the body:
     lean  — the top of the body leans toward where Neko looks
     turn  — the head turns: face slides sideways and foreshortens, ears follow
     squash— squash and stretch on every pose change, pet, hop or fright
   Bottom points stay planted; the higher a point, the more it moves.
   ====================================================================== */
const SB_NS='http://www.w3.org/2000/svg';
const SPR={lean:[70,7.5],turn:[95,10],squash:[210,9],y:[90,9]};
function sbDeform(pts,b){const L=b.lean.v,T=b.turn.v,Q=b.squash.v,Y=b.y.v;
 return pts.map(([x,y])=>{const h=Math.max(0,Math.min(1,(186-y)/150)),h2=Math.pow(h,1.6),side=(x-100)/66;
  let X=100+(x-100)*(1+Q*.07*(1-.45*h))+L*9*h2+T*4*Math.pow(h,2.4)*(1-.3*side*Math.sign(T||1));
  let Yy=186-(186-y)*(1-Q*.085)+Y*3*h2;
  /* the ear on the side Neko turns toward dips a little, the far ear rises: reads as a head turn */
  if(h>.62)Yy+=T*side*3*(h-.62)/.38;
  return [X,Yy]})}
function softify(c){if(!c||c._soft||!c.svg)return c;c._soft=1;
 const b={};Object.keys(SPR).forEach(k=>b[k]={v:0,vel:0,t:0});c.sb=b;c.svg.classList.add('soft');
 const face=c.svg.querySelector('.n5-face');const g=document.createElementNS(SB_NS,'g');g.setAttribute('class','sbf');face.before(g);
 [face,c.decEl,c.svg.querySelector('.n5-pawh')].forEach(n=>n&&g.appendChild(n));c.sbf=g;
 let run=0,last=0;
 const step=now=>{if(!c.alive()){run=0;return}const dt=Math.min(.034,(now-last)/1000||.016);last=now;let moving=false;
  for(const k in b){const s=b[k],[K,D]=SPR[k];const a=-K*(s.v-s.t)-D*s.vel;s.vel+=a*dt;s.v+=s.vel*dt;if(Math.abs(s.v-s.t)>.0015||Math.abs(s.vel)>.0015)moving=true;else{s.v=s.t;s.vel=0}}
  c.paint();if(moving||c._morphing)requestAnimationFrame(step);else run=0};
 c.kick=()=>{if(NK_RM())return;if(!run){run=1;last=performance.now();requestAnimationFrame(step)}};
 c.paint=function(){const P=sbDeform(this.pts,b),d=nkPath(P);this.bodyEl.setAttribute('d',d);
  if(this.clipEl){this.clipEl.setAttribute('d',d);if(this.spots){const C=nkPatchC(P,this.fa,this.spots);this.patEls.forEach((e,i)=>e.setAttribute('transform',nkTf(C[i])))}}
  const L=b.lean.v,T=b.turn.v,Q=b.squash.v,Y=b.y.v,k=Math.pow(.72,1.6);
  this.tailEl.setAttribute('cx',(this.tc[0]-L*4-T*2).toFixed(1));this.tailEl.setAttribute('cy',(this.tc[1]+Q*2).toFixed(1));this.tailEl.setAttribute('r',(this.tc[2]*(1+Q*.08)).toFixed(1));
  const fx=L*9*k+T*6,fy=(186-82)*Q*.085+Y*3*k,sx=(1+Q*.04)*(1-Math.min(.12,Math.abs(T)*.08)),sy=1-Q*.06;
  g.setAttribute('transform',`translate(${fx.toFixed(2)} ${fy.toFixed(2)}) translate(100 82) rotate(${(L*3).toFixed(2)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(-100 -82)`);
  this.onSoft&&this.onSoft(b)};
 c.paintPat=function(){};
 const morph=c.morph.bind(c);c.morph=function(tb,tt,D,ease,done){this._morphing=1;this.kick();morph(tb,tt,D,ease,()=>{this._morphing=0;done&&done()})};
 const look=c.look.bind(c);c.look=function(x,y,auto){look(x,y,auto);const cx=Math.max(-1.3,Math.min(1.3,x)),cy=Math.max(-1,Math.min(1,y));b.lean.t=cx*.55;b.turn.t=cx*.8;b.y.t=cy*.35;this.kick()};
 const to=c.to.bind(c);c.to=function(p,o){to(p,o);b.squash.vel+=(p==='surprised'||p==='delighted')?-9:6;this.kick()};
 const pet=c.pet.bind(c);c.pet=function(){pet();b.squash.vel+=11;b.lean.vel+=(Math.random()-.5)*7;this.kick()};
 const bounce=c.bounce.bind(c);c.bounce=function(){bounce();b.squash.vel+=8;this.kick()};
 const fright=c.fright.bind(c);c.fright=function(){fright();b.squash.vel-=14;this.kick()};
 c.jiggle=(n=8)=>{b.squash.vel+=n;b.lean.vel+=(Math.random()-.5)*n*.6;c.kick()};
 /* looks back over its shoulder: big lean and turn, brows up, then settles with a wobble */
 c.lookBack=(dir=Math.random()<.5?-1:1,ms=1500)=>{if(!c.alive())return;look(dir*1,-.25,true);b.lean.t=dir*.85;b.turn.t=dir*1.25;c.brows&&c.brows(ms);c.kick();
  clearTimeout(c._lb);c._lb=setTimeout(()=>{if(!c.alive())return;look(0,0,true);b.lean.t=0;b.turn.t=0;b.y.t=0;c.kick()},ms)};
 /* a stretchy reach upward (used when something exciting happens) */
 c.stretch=()=>{b.squash.vel-=16;c.kick()};
 /* subtle idle drift so the body never looks frozen */
 const drift=()=>{if(!c.alive())return;if(!NK_RM()&&Math.abs(b.lean.t)<.2&&Math.random()<.5){b.lean.vel+=(Math.random()-.5)*1.6;c.kick()}c._dr=setTimeout(drift,2600+Math.random()*2600)};c._dr=setTimeout(drift,1800);
 c.paint();return c}

function magnets(){$$('.mag').forEach(b=>{if(b._mag)return;b._mag=1;let raf=0,last=0,tx=0,ty=0,x=0,y=0,vx=0,vy=0;
 const step=t=>{const dt=Math.min(.033,last?(t-last)/1000:1/60);last=t;const K=170,D=21;vx+=((tx-x)*K-vx*D)*dt;vy+=((ty-y)*K-vy*D)*dt;x+=vx*dt;y+=vy*dt;b.style.translate=`${x.toFixed(2)}px ${y.toFixed(2)}px`;
  if(Math.abs(tx-x)>.05||Math.abs(vx)>2||Math.abs(ty-y)>.05||Math.abs(vy)>2)raf=requestAnimationFrame(step);else{raf=0;last=0;b.style.translate=`${tx}px ${ty}px`}};
 const go=()=>{if(!raf&&!NK_RM())raf=requestAnimationFrame(step)};
 b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();tx=(e.clientX-r.left-r.width/2)*.16;ty=(e.clientY-r.top-r.height/2)*.22;go()});
 b.addEventListener('pointerleave',()=>{tx=0;ty=0;go()})})}
/* 3D tilt with a soft glare for cards */
const TILT='.lc,.uc:not(.lock),.book,.prc,.sp .phone,.bx,.skb,.qcard';
const ease=(k,dt)=>1-Math.pow(1-k,dt*60); /* frame-rate independent smoothing */
function tilts(){$$(TILT).forEach(el=>{if(el._tilt)return;el._tilt=1;el.classList.add('tiltc');
 const big=el.matches('.lc,.uc,.book,.prc'),flat=el.matches('.bx,.skb'),lift=big?12:flat?6:9,turn=big?-1.2:0,amp=flat?.45:1;
 let raf=0,last=0,tx=0,ty=0,th=0,x=0,y=0,h=0;
 const g=document.createElement('span');g.className='glare';el.appendChild(g);
 const step=t=>{const dt=Math.min(.05,last?(t-last)/1000:1/60);last=t;const k=ease(.11,dt),kh=ease(.09,dt);
  x+=(tx-x)*k;y+=(ty-y)*k;h+=(th-h)*kh;
  el.style.transform=h<.001&&Math.abs(x)<.001&&Math.abs(y)<.001?'':`perspective(1200px) translate3d(0,${(-lift*h).toFixed(2)}px,0) rotateX(${(-y*8*amp).toFixed(2)}deg) rotateY(${(x*10*amp).toFixed(2)}deg) rotate(${(turn*h).toFixed(2)}deg) scale(${(1+.012*h).toFixed(4)})`;
  el.style.setProperty('--gl',h.toFixed(3));
  if(Math.abs(tx-x)>.0015||Math.abs(ty-y)>.0015||Math.abs(th-h)>.0015)raf=requestAnimationFrame(step);else{raf=0;last=0;if(!th){h=x=y=0;el.style.transform=""}}};
 const go=()=>{if(!raf&&!NK_RM())raf=requestAnimationFrame(step)};
 el.addEventListener('pointerenter',()=>{th=1;go()});
 el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5;el.style.setProperty('--gx',((tx+.5)*100).toFixed(1)+'%');el.style.setProperty('--gy',((ty+.5)*100).toFixed(1)+'%');th=1;go()});
 el.addEventListener('pointerleave',()=>{tx=0;ty=0;th=0;go()})})}

 $('#lf').innerHTML=`<div class="msg"><span class="hint">Press <kbd>Enter</kbd> to continue</span></div><button class="btn ghost" id="again">Play again</button><button class="btn" id="nx">Continue</button>`;
 const c=catIn($('#rcat'),{state:'delighted',scene:''});confetti();Sound.win();
 LS.answered=true;LS.done=true;
 $('#nx').addEventListener('click',closeLesson);$('#again').addEventListener('click',()=>{const {k,j}=L2;closeLesson();startLesson(k,j)});}

/* ---- Practice ---- */
function learnedWords(){const ws=[...new Set(allUnits().filter(k=>unitPct(k)>0).flatMap(k=>unitOf(k).words))];return ws.length>=8?ws:UNITS.A1[0].words.concat(UNITS.A1[1].words)}
function vPractice(v){v.innerHTML=`<div class="prgrid">
  <div class="prc" style="background:#E4F8EE"><h3>Match game</h3><p>Pair 6 words with their pictures. Fast hands win more fish.</p><button class="btn green" id="pm">Play</button><span class="pc" id="pc1"></span></div>
  <div class="prc" style="background:#F1ECFF"><h3>Flashcards</h3><p>Space to flip, arrows to move. Neko reads each card out loud.</p><button class="btn" style="background:var(--lav);box-shadow:0 6px 0 #7559D6" id="pf">Open deck</button><span class="pc" id="pc2"></span></div>
  <div class="prc" style="background:var(--o100)"><h3>Mixed review</h3><p>A quiz of everything you’ve learned so far.</p><button class="btn" id="pr">Start review</button><span class="pc" id="pc3"></span></div>
  <div class="prc" style="background:#E6F4FF"><h3>Listening drill</h3><p>Eyes closed, ears open. Pick what you hear.</p><button class="btn" style="background:var(--blue);box-shadow:0 6px 0 #1F86CF" id="pl">Start drill</button><span class="pc" id="pc4"></span></div></div>
  <div id="game"></div>`;
 [['pc1','playful'],['pc2','love'],['pc3','confused'],['pc4','surprised']].forEach(([id,m])=>mute(catIn($('#'+id),{state:m})));
 $('#pm').addEventListener('click',()=>matchGame(learnedWords()));$('#pf').addEventListener('click',()=>flashcards(learnedWords(),'Your words'));
 $('#pr').addEventListener('click',()=>startLesson(nextUnit(),3,learnedWords()));$('#pl').addEventListener('click',()=>startLesson(nextUnit(),1,learnedWords()))}
function matchGame(words){const g=$('#game');if(!g)return;const lg=L(),ids=shuffle(words).slice(0,6);let tiles=shuffle([...ids.map(id=>({id,k:'w'})),...ids.map(id=>({id,k:'e'}))]),sel=null,left=6,t0=Date.now();
 g.innerHTML=`<h3 class="sh">Match game <span id="mtm" style="color:var(--mute);font-size:18px"></span></h3><div class="mgrid">${tiles.map((t,i)=>`<button class="mt ${t.k==='e'?'e':''} ${lgCls(lg)}" data-i="${i}">${t.k==='e'?pic(W(t.id,lg).pic):esc(W(t.id,lg).word)}</button>`).join('')}</div>`;
 g.scrollIntoView({behavior:'smooth',block:'start'});const tm=setInterval(()=>{const e=$('#mtm');if(!e)return clearInterval(tm);e.textContent=((Date.now()-t0)/1000).toFixed(1)+'s'},100);
 $$('.mt',g).forEach(b=>b.addEventListener('click',()=>{const t=tiles[+b.dataset.i];if(t.k==='w')say(W(t.id,lg).word,lg);
  if(!sel){sel=b;b.classList.add('sel');return}if(sel===b){b.classList.remove('sel');sel=null;return}
  const a=tiles[+sel.dataset.i];if(a.id===t.id&&a.k!==t.k){sel.classList.add('ok');b.classList.add('ok');Sound.good();BUDDY&&BUDDY.set('happy',900);left--;
   if(!left){clearInterval(tm);const s=((Date.now()-t0)/1000).toFixed(1);addFish(20);stamp('match');confetti(60);Sound.win();BUDDY&&BUDDY.set('delighted',2000);buddySay(`${s} seconds! Speedy paws.`);
    setTimeout(()=>{g.innerHTML=`<div class="card" style="padding:40px;text-align:center;margin-top:30px"><h2 style="font-size:46px;font-weight:1000">All matched in ${s}s!</h2><p class="lead" style="margin:10px auto 0">+20 fish. Can you go faster?</p><button class="btn" style="margin-top:20px" id="mag">Play again</button></div>`;$('#mag').addEventListener('click',()=>matchGame(words))},700)}}
  else{[sel,b].forEach(x=>{x.classList.remove('no');void x.offsetWidth;x.classList.add('no')});Sound.bad();BUDDY&&BUDDY.set('confused',900)}
  sel.classList.remove('sel');sel=null}))}
function flashcards(words,name){const g=$('#game');if(!g)return;const lg=L();let i=0;const ids=shuffle(words);
 const draw=()=>{const w=W(ids[i],lg);g.innerHTML=`<h3 class="sh">Flashcards · ${esc(name)} <span style="color:var(--mute);font-size:18px">${i+1}/${ids.length}</span></h3>
  <div class="flash" id="fl"><div class="in"><div class="fa"><span class="w ${lgCls(lg)}">${esc(w.word)}</span>${w.rom?`<span class="r">${esc(w.rom)}</span>`:''}<span class="r" style="margin-top:20px;font-size:15px">Click or press space to flip</span></div><div class="fb"><span class="e">${pic(w.pic)}</span><span class="w">${esc(w.en)}</span></div></div></div>
  <div class="fnav"><button class="btn ghost sm" id="fp">← Prev</button><span class="kbd">Space</span> flip <button class="btn sm" id="fn">Next →</button></div>`;
  $('#fl').addEventListener('click',()=>{$('#fl').classList.toggle('flip');say(w.word,lg)});$('#fp').addEventListener('click',()=>{i=(i-1+ids.length)%ids.length;draw()});$('#fn').addEventListener('click',()=>{i=(i+1)%ids.length;draw()})};
 draw();g.scrollIntoView({behavior:'smooth',block:'start'});
 const key=e=>{if(!$('#fl')){removeEventListener('keydown',key);return}if(e.code==='Space'){e.preventDefault();$('#fl').click()}if(e.key==='ArrowRight')$('#fn').click();if(e.key==='ArrowLeft')$('#fp').click()};addEventListener('keydown',key)}
