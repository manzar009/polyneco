<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F07A1F"><meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Polyneco app v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+Arabic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --o50:#FFF4EA;--o100:#FFE6D1;--o200:#FFCFA8;--o300:#FFB57A;--o400:#F9994B;--o500:#F07A1F;--o600:#D9620C;--o800:#9A4212;
 --coat:#F59E56;--ink:#3A2A20;--ink2:#6E5A4C;--mute:#A8968A;--line:#F1E6DB;--cream:#FFF9F3;--sand:#F6EEE6;--card:#FFFFFF;
 --blue:#3BA8F5;--sun:#FFC93C;--green:#34C77B;--red:#F2545B;--pink:#FF6FA8;--lav:#9B7BF7;--teal:#19B5A5;
 --a1:#34C77B;--a2:#19B5A5;--b1:#3BA8F5;--b2:#9B7BF7;--c1:#FF6FA8;
 --sh1:0 1px 3px rgba(154,66,18,.07);
 --sh2:0 8px 24px rgba(154,66,18,.14);
 --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F3E7DA;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
#app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--cream)}
@media(min-width:600px){body{align-items:center;background:radial-gradient(circle at 30% 20%,#FFE6D1,#F3E2D2 60%)}#app{height:min(900px,96dvh);border-radius:38px;box-shadow:0 30px 80px rgba(154,66,18,.25)}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px}
.scroll::-webkit-scrollbar{display:none}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 20px 12px;scroll-snap-type:x mandatory;scroll-padding-inline:20px}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:none}
.hs::after{content:'';flex:0 0 8px}
h1,h2,h3,h4,p{margin:0}
.h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
.h2{font-size:20px;font-weight:900}
.h3{font-size:16px;font-weight:800}
.small{font-size:13px}.tiny{font-size:11px}.muted{color:var(--mute)}.b{font-weight:800}.c{text-align:center}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:12px}
.pad{padding:0 20px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh1)}
.ico{display:inline-block;width:24px;height:24px;flex:none}.ico svg,.flag svg,.av svg{width:100%;height:100%;display:block}
.flag{display:inline-block;width:28px;height:20px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(58,42,32,.06)}
.flag.r{width:26px;height:26px;border-radius:50%}
.tl.ar,.ar{font-family:'Noto Sans Arabic',Nunito,sans-serif}
.ja{font-family:'Noto Sans JP',Nunito,sans-serif}

/* ===== Buttons: jelly pills, no hard lips ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;font-weight:800;font-size:16px;color:#fff;background:var(--o500);transition:transform .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97);background:var(--o600)}
.btn.block{display:flex;width:100%}
.btn.soft{background:var(--o100);color:var(--o600)}.btn.soft:active{background:var(--o200)}
.btn.ghost{background:transparent;color:var(--o600)}.btn.ghost:active{background:var(--o50)}
.btn.white{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.white:active{background:var(--sand)}
.btn.green{background:var(--green)}.btn.green:active{background:#26A866}
.btn.blue{background:var(--blue)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn[disabled]{filter:grayscale(1) opacity(.5);pointer-events:none}
.jelly{animation:jelly .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes popsq{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-14px) scale(.9,1.12)}48%{transform:translateY(0) scale(1.16,.84)}66%{transform:translateY(-4px) scale(.96,1.05)}82%{transform:translateY(0) scale(1.03,.97)}100%{transform:translateY(0) scale(1)}}
.popsq{animation:popsq .7s cubic-bezier(.3,1,.5,1)}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.12,.88)}50%{transform:scale(.92,1.08)}70%{transform:scale(1.04,.96)}100%{transform:scale(1)}}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:none;border:1.5px solid var(--line);flex:none;position:relative;transition:transform .2s}
.iconbtn:active{transform:scale(.9)}
.iconbtn .ico{width:24px;height:24px}
.dot-badge{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:var(--ink2);border:1.5px solid var(--line);white-space:nowrap}
.chip.on{background:var(--o500);color:#fff;border-color:var(--o500)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.3px}
.bar{height:8px;border-radius:99px;background:var(--o100);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--o400),var(--o500));transition:width .6s cubic-bezier(.3,1.3,.5,1)}

/* ===== Home header (per Figma) ===== */
.top{padding:14px 16px 8px;display:flex;align-items:center;gap:8px;position:relative;z-index:5}
.hudpills{flex:1;display:flex;justify-content:center;gap:6px;min-width:0;border-radius:999px}
.langbtn{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 8px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}
.langbtn .flag{width:30px;height:21px}
.langbtn .car{width:14px;height:14px;transition:transform .3s}
.langbtn.open .car{transform:rotate(180deg)}
.pill{display:flex;align-items:center;gap:5px;height:40px;padding:0 11px 0 7px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:900;font-size:14px;white-space:nowrap}
.pill .ico{width:24px;height:24px}
.pill .up{color:var(--green);font-size:12px}
.rankpill{background:#FFF4CC;border-color:#FFE7A0;color:#8A5A00}
.lvrow{margin:6px 20px 0;padding:10px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;gap:12px;position:relative}
.lvrow .lv{font-weight:900;font-size:15px;white-space:nowrap}
.lvrow .bar{flex:1;height:10px}
.lvrow .pct{font-weight:900;color:var(--o600);font-size:14px}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border-radius:20px;box-shadow:var(--sh2);padding:10px;z-index:30;transform-origin:top center;animation:drop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{opacity:0;transform:scale(.9,.6) translateY(-10px)}to{opacity:1;transform:none}}
.lvitem{display:flex;align-items:center;gap:10px;padding:8px 6px}
.lvitem .lvb{width:38px;height:28px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:16px;background:var(--sand);text-align:left;transition:transform .2s}
.langcard.on{background:var(--o50);box-shadow:inset 0 0 0 2px var(--o300)}
.langcard .flag{width:38px;height:27px}
.langcard:active{transform:scale(.95)}

.sechead{display:flex;align-items:center;gap:10px;padding:22px 20px 10px}
.sechead .h2{flex:1}
.link{color:var(--o600);font-weight:900;font-size:13px}
.sq{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;box-shadow:var(--sh1);position:relative;flex:none}
.sq .ico{width:30px;height:30px}
.sq b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:99px;padding:0 7px;font-size:11px;box-shadow:var(--sh1);white-space:nowrap}

/* recent lesson card */
.recent{width:calc(100vw - 40px);max-width:353px;padding:16px;border-radius:24px;background:#fff;box-shadow:var(--sh1);position:relative;overflow:hidden}
.recent .blob{position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;opacity:.14}
.recent .lvtag{color:#fff}
.skills{display:flex;justify-content:space-between;margin-top:14px}
.skill{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink2);width:56px}
.skill .sk{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;position:relative}
.skill .sk .ico{width:26px;height:26px}
.skill .ok{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.skill .ok svg{width:12px;height:12px}

/* unit cards */
.unit{width:118px;height:140px;border-radius:20px;padding:12px;display:flex;flex-direction:column;position:relative;overflow:hidden;text-align:left;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.unit:active{transform:scale(.95)}
.unit .u{font-weight:900;font-size:15px;color:#fff;position:relative;z-index:1}
.unit .nm{font-size:11px;font-weight:800;color:rgba(255,255,255,.95);position:relative;z-index:1;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .art{position:absolute;right:4px;bottom:34px;width:66px;height:54px;display:grid;place-items:end center}
.unit .art .em{font-size:40px;line-height:1}
.unit .deco{position:absolute;left:-14px;bottom:-24px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14)}
.unit .foot{margin-top:auto;position:relative;z-index:1}
.unit .foot .tiny{color:#fff;font-weight:800}
.unit .bar{height:6px;background:rgba(255,255,255,.4);margin-top:4px}.unit .bar>i{background:#fff}
.unit.locked{background:var(--sand)!important}.unit.locked .u,.unit.locked .nm,.unit.locked .foot .tiny{color:var(--mute)}
.unit.locked .art{filter:grayscale(1);opacity:.4}.unit.locked .deco{display:none}
.unit .lk{position:absolute;right:10px;top:10px;width:22px;height:22px}
.lvlhead{display:flex;align-items:center;gap:10px;padding:18px 20px 8px}
.lvlhead .lvb{min-width:36px;height:26px;border-radius:9px;color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;padding:0 6px}

/* tab bar */
.tabs{position:absolute;left:12px;right:12px;bottom:12px;height:68px;border-radius:24px;background:#fff;box-shadow:0 4px 16px rgba(154,66,18,.12);display:flex;align-items:center;justify-content:space-around;z-index:20;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--mute);width:62px;transition:color .2s}
.tab .ico{width:26px;height:26px}
.tab.on{color:var(--o500)}
.tab.home{width:62px;height:62px;border-radius:22px;margin-top:-30px;background:var(--o500);color:#fff;justify-content:center;box-shadow:0 0 0 5px var(--cream)}
.tab.home .ico{width:32px;height:32px}

/* sheets & modals */
.veil{position:absolute;inset:0;background:rgba(58,42,32,.42);z-index:60;display:flex;align-items:flex-end;animation:fade .25s}
.veil.center{align-items:center;justify-content:center;padding:24px}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--cream);border-radius:30px 30px 0 0;padding:10px 20px 26px;animation:sheetin .45s cubic-bezier(.3,1.3,.5,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@keyframes sheetin{from{transform:translateY(100%)}}
.pop{width:100%;max-width:360px;background:#fff;border-radius:28px;padding:20px;box-shadow:var(--sh2);animation:popin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-140%);background:#fff;color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:var(--sh2);z-index:200;pointer-events:none;transition:transform .45s cubic-bezier(.3,1.5,.5,1);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:92%}
.toast.show{transform:translate(-50%,0)}
.toast .ico{width:22px;height:22px}

/* unit card-effect popover */
.ucard{position:absolute;z-index:70;border-radius:28px;overflow:hidden;background:#fff;box-shadow:var(--sh2);transform-origin:top left}
.ucard .uhead{padding:18px 18px 46px;color:#fff;position:relative}
.ucard .uhead .em{position:absolute;right:16px;top:10px;font-size:58px}
.ucard .ubody{background:#fff;margin-top:-30px;border-radius:26px 26px 0 0;padding:16px 18px 18px;position:relative}
.lsn{display:flex;align-items:center;gap:12px;padding:9px 0}
.lsn .sk{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;position:relative}
.lsn .sk .ico{width:24px;height:24px}
.lsn .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.lsn .st svg{width:16px;height:16px}

/* ===== Cat + bubbles ===== */
.cat{width:100%;height:100%;overflow:visible}
.catbox{position:relative}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-weight:800;font-size:15px;box-shadow:var(--sh1);line-height:1.35}
.bubble::after{content:'';position:absolute;left:28px;bottom:-9px;width:18px;height:18px;background:#fff;transform:rotate(45deg);border-radius:3px}
.bubble.left::after{left:-7px;top:22px;bottom:auto}
.bubble.top::after{top:-7px;bottom:auto}
.fx-up{animation:fxup 1.6s ease-in-out infinite}
@keyframes fxup{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-6px);opacity:.75}}
.fx-bob{animation:fxbob 1.4s ease-in-out infinite}
@keyframes fxbob{50%{transform:translateY(-4px) rotate(4deg)}}
.fx-z text{animation:fxz 2.2s ease-in-out infinite}.fx-z text:nth-child(2){animation-delay:.4s}.fx-z text:nth-child(3){animation-delay:.8s}
@keyframes fxz{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.fx-pulse{animation:fxpulse .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes fxpulse{to{transform:scale(1.25)}}
.fx-steam circle{animation:fxz 1.2s ease-out infinite}
.fx-tw path{animation:fxtw .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes fxtw{to{transform:scale(.4) rotate(45deg)}}
.tear{stroke-dasharray:6 8;animation:tear .6s linear infinite}
@keyframes tear{to{stroke-dashoffset:-14}}
.fx-fish{animation:fxbob .9s ease-in-out infinite}

/* ===== Splash / onboarding ===== */
.splash{background:radial-gradient(circle at 50% 35%,#FFB36B,#F07A1F 70%);color:#fff;align-items:center;justify-content:center;text-align:center}
.logo{font-size:44px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center;gap:2px}
.logo .o{display:inline-block;width:38px;height:38px;border-radius:50%;background:#fff;position:relative;margin:0 1px}
.logo .o::before,.logo .o::after{content:'';position:absolute;top:-7px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #fff}
.logo .o::before{left:2px;transform:rotate(-14deg)}.logo .o::after{right:2px;transform:rotate(14deg)}
.logo .o i{position:absolute;top:13px;width:9px;height:11px;border-radius:50%;background:var(--o600)}
.logo .o i:first-child{left:8px}.logo .o i:last-child{right:8px}
.pop-in{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
.rise{animation:rise .6s cubic-bezier(.3,1.3,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.ob{background:var(--cream)}
.ob .obtop{display:flex;align-items:center;gap:12px;padding:16px 20px}
.ob .dots{display:flex;gap:6px;flex:1}
.ob .dots i{height:8px;flex:1;border-radius:9px;background:var(--o100);transition:background .3s}
.ob .dots i.on{background:var(--o500)}
.ob .obbody{flex:1;overflow-y:auto;padding:0 20px 20px;display:flex;flex-direction:column}
.ob .obfoot{padding:12px 20px 24px}
.catrow{display:flex;align-items:flex-end;gap:6px;margin:6px 0 14px}
.catrow .catbox{width:112px;height:112px;flex:none}
.catrow .bubble{margin-bottom:34px}
.field{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 16px;height:52px;border:1.5px solid var(--line);transition:border-color .2s}
.field:focus-within{border-color:var(--o400)}
.field input{flex:1;border:0;outline:0;background:none;font-size:16px;font-weight:700;min-width:0}
.field .ico{width:22px;height:22px;opacity:.6}
.opt-list{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:#fff;box-shadow:var(--sh1);text-align:left;font-weight:800;transition:transform .2s,box-shadow .2s}
.optrow.on{box-shadow:0 0 0 3px var(--o400),var(--sh1);background:var(--o50)}
.optrow:active{transform:scale(.97)}
.optrow .flag{width:40px;height:28px}
.optrow .em{font-size:26px;width:40px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:14px;border-radius:20px;background:#fff;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:800;transition:transform .2s,box-shadow .2s}
.tile.on{box-shadow:0 0 0 3px var(--o400),var(--sh1);background:var(--o50)}
.tile:active{transform:scale(.96)}
.tile .em{font-size:28px}

/* loading */
.loading{background:linear-gradient(180deg,#FFF4EA,#FFE6D1);align-items:center;justify-content:center;text-align:center;padding:30px}
.loading .catbox{width:190px;height:190px}
.cushion{width:170px;height:28px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#FFB57A,#F07A1F);margin-top:-30px;box-shadow:0 8px 16px rgba(240,122,31,.25)}
.yarnbar{width:220px;height:10px;border-radius:9px;background:#fff;margin:26px auto 0;position:relative;overflow:visible}
.yarnbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--o400);width:0}
.yarnbar .ball{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;left:0}
.tipcard{margin-top:26px;background:#fff;border-radius:22px;padding:16px 18px;box-shadow:var(--sh1);max-width:330px;text-align:left}
.tipcard .row{margin-bottom:6px}

/* coach marks */
.coach{position:absolute;inset:0;z-index:150}
.coach .hole{position:absolute;border-radius:24px;box-shadow:0 0 0 2000px rgba(42,28,18,.62);transition:all .5s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.coach .hole.none{left:50%!important;top:40%!important;width:0!important;height:0!important}
.coach .ring{position:absolute;border-radius:26px;border:3px dashed rgba(255,255,255,.85);transition:all .5s cubic-bezier(.3,1.3,.5,1);pointer-events:none;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.03)}}
.coach .panel{position:absolute;left:14px;right:14px;display:flex;align-items:flex-end;gap:4px;transition:top .5s cubic-bezier(.3,1.3,.5,1)}
.coach .panel .catbox{width:100px;height:100px;flex:none}
.coach .panel .bubble{flex:1;margin-bottom:22px}
.coach .panel .bubble.left::after{top:auto;bottom:22px}
.coach .ctr{display:flex;align-items:center;gap:8px;margin-top:10px}
.coach .ctr .tiny{flex:1;color:var(--mute);font-weight:900}

/* ===== Lesson (active play) ===== */
.lesson{background:var(--cream)}
.lhud{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.lhud .ytrack{flex:1;height:14px;border-radius:9px;background:var(--o100);position:relative}
.lhud .ytrack i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--o300),var(--o500));transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.lhud .ytrack .ball{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;transition:left .5s cubic-bezier(.3,1.3,.5,1)}
.lhud .ytrack .ball svg{animation:spin 1.2s linear infinite paused}
.lhud .ytrack .ball.roll svg{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:15px;padding:6px 10px;border-radius:999px;background:#fff;box-shadow:var(--sh1)}
.stat .ico{width:22px;height:22px}
.qwrap{flex:1;overflow-y:auto;padding:10px 20px 0;display:flex;flex-direction:column}
.qtag{font-size:12px;font-weight:900;letter-spacing:.8px;color:var(--o600);text-transform:uppercase}
.qtitle{font-size:22px;font-weight:900;margin:4px 0 14px}
.prompt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:16px 18px;box-shadow:var(--sh1);margin-bottom:16px}
.prompt .word{font-size:30px;font-weight:900}
.spk{width:52px;height:52px;border-radius:16px;background:var(--blue);display:grid;place-items:center;flex:none}
.spk .ico{width:28px;height:28px}
.spk.big{width:92px;height:92px;border-radius:30px;margin:6px auto}
.spk.big .ico{width:46px;height:46px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;background:#fff;border-radius:22px;min-height:112px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--sh1);font-weight:900;font-size:18px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
.opt:active{transform:scale(.95)}
.opt .pic{font-size:52px;line-height:1}
.opt .n{position:absolute;left:10px;top:8px;font-size:11px;color:var(--mute)}
.opt.wordy{min-height:84px}
.opt.ok{background:#E7F9EF;box-shadow:0 0 0 3px var(--green);animation:jelly .6s}
.opt.bad{background:#FFECEC;box-shadow:0 0 0 3px var(--red);animation:shake .45s}
.opt.dim{opacity:.45}
.opt.gone{opacity:.15;pointer-events:none;transform:scale(.9)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lfoot{position:relative;padding:8px 16px 22px;display:flex;align-items:flex-end;gap:10px;min-height:130px}
.lfoot .catbox{width:104px;height:104px;flex:none}
.lfoot .say{flex:1;display:flex;flex-direction:column;gap:10px;align-items:stretch;padding-bottom:6px}
.lfoot .bubble{font-size:14px}
.lfoot .bubble.good{color:#1E8F54}.lfoot .bubble.bad{color:#C93C42}
.combo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:var(--o500);text-shadow:0 4px 0 #fff;pointer-events:none;animation:combo 1.1s cubic-bezier(.3,1.5,.5,1) forwards;z-index:40;white-space:nowrap}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
.flyer{position:absolute;width:26px;height:26px;z-index:90;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .2s .7s}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* results */
.result{background:linear-gradient(180deg,#FFE6D1 0%,var(--cream) 45%);align-items:center;text-align:center;padding:24px 20px}
.result .catbox{width:200px;height:200px}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;margin-top:10px}
.stile{border-radius:20px;padding:12px;background:#fff;box-shadow:var(--sh1);display:flex;align-items:center;gap:10px;text-align:left}
.stile .ico{width:34px;height:34px}
.stile .v{font-size:20px;font-weight:900}
.trail{display:flex;align-items:flex-end;justify-content:space-between;position:relative;padding:8px 4px 4px}
.trail .pp{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;position:relative;transition:transform .4s}
.trail .pp svg{width:24px;height:24px}
.trail .pp.on{background:var(--o100)}
.trail .pp.today{background:var(--o500);transform:scale(1.18)}
.trail .pp .tiny{position:absolute;bottom:-17px;font-weight:800;color:var(--mute)}
.stamp{animation:stamp .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:scale(1.18);opacity:1}}

/* cardboard surprise box */
.boxwrap{position:relative;width:220px;height:220px;margin:0 auto}
.boxwrap .box{position:absolute;left:30px;right:30px;bottom:10px;height:110px}
.boxwrap.shake .box{animation:boxshake .5s ease-in-out infinite}
@keyframes boxshake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.boxwrap .peekcat{position:absolute;left:45px;right:45px;bottom:70px;height:130px;transform:translateY(80px);opacity:0;transition:all .7s cubic-bezier(.3,1.6,.5,1)}
.boxwrap.open .peekcat{transform:none;opacity:1}
.boxwrap .flapL,.boxwrap .flapR{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box}
.boxwrap .flapL{transform-origin:left bottom}.boxwrap .flapR{transform-origin:right bottom}
.boxwrap.open .flapL{transform:rotate(-115deg)}
.boxwrap.open .flapR{transform:rotate(115deg)}
.prize{margin-top:6px;font-weight:900;font-size:20px}

/* leaderboard */
.lbhead{background:linear-gradient(160deg,#FFC93C 0%,#F9994B 60%,#F07A1F 100%);color:#fff;padding:16px 20px 90px;position:relative;overflow:hidden}
.lbhead .shine{position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);right:-80px;top:-100px}
.tiers{display:flex;gap:8px;margin-top:14px}
.tiers .t{flex:1;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tiers .t.on{background:#fff}
.tiers .t .ico{width:28px;height:28px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:-74px 20px 0;position:relative;z-index:2}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .av{width:62px;height:62px}
.pod.p1 .av{width:78px;height:78px}
.pod .blk{width:100%;border-radius:20px 20px 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;color:#fff;font-weight:900;box-shadow:var(--sh1)}
.pod .nm{font-weight:900;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .crown{width:34px;height:24px;margin-bottom:-8px}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:#fff;box-shadow:var(--sh1)}
.lbrow .rk{width:24px;font-weight:900;color:var(--mute);text-align:center}
.lbrow .av{width:40px;height:40px}
.lbrow.me{background:var(--o50);box-shadow:0 0 0 2px var(--o300)}
.zone{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;color:var(--green);padding:4px 6px}
.zone.down{color:var(--red)}
.zone::before,.zone::after{content:'';flex:1;height:2px;border-radius:2px;background:currentColor;opacity:.25}
.av{display:inline-block;border-radius:50%;overflow:visible;flex:none}

/* learn */
.carousel{position:relative;margin:0 20px;height:150px;border-radius:26px;overflow:hidden}
.carousel .slides{display:flex;height:100%;transition:transform .35s cubic-bezier(.3,1,.5,1)}
.slide{flex:none;width:100%;height:100%;padding:18px;color:#fff;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;overflow:hidden}
.slide .wave{position:absolute;left:0;right:0;bottom:-2px;height:50px;opacity:.25}
.slide .art{position:absolute;right:8px;bottom:0;width:130px;height:110px}
.slide .art svg{width:100%;height:100%}
.slide>*:not(.art):not(.wave){position:relative;z-index:1;max-width:62%;text-align:left}
.cdots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.cdots i{width:8px;height:8px;border-radius:9px;background:var(--o200);transition:all .3s}
.cdots i.on{width:22px;background:var(--o500)}
.vcard{display:flex;gap:12px;padding:12px;border-radius:22px;background:#fff;box-shadow:var(--sh1);align-items:center;text-align:left;width:100%}
.vthumb{width:96px;height:72px;border-radius:16px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.vthumb .play{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center}
.vthumb .play svg{width:18px;height:18px}
.vthumb .em{position:absolute;left:6px;bottom:2px;font-size:22px}
.tutor{width:220px;padding:14px;border-radius:24px;background:#fff;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:8px}
.tutor .av{width:52px;height:52px}
.xpb{background:#E9F6FF;color:#1F7BC0}
.locktag{background:var(--sand);color:var(--ink2)}
.ptile{border-radius:20px;padding:14px;color:#fff;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-align:left;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ptile:active{transform:scale(.95)}
.ptile .bg{position:absolute;right:-14px;bottom:-16px;width:110px;height:110px;opacity:.22}
.ptile .bg svg{width:100%;height:100%}
.ptile .fg{position:absolute;right:10px;top:10px;width:40px;height:40px}
.ptile .fg svg{width:100%;height:100%}
.ptile b,.ptile .tiny{position:relative}
.ptile b{font-size:15px}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000}
.vbox{width:100%;aspect-ratio:16/9;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.slot{padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh1);font-weight:800;font-size:13px}
.slot.on{background:var(--o500);color:#fff}

/* match game & flashcards (card effect) */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:800px}
.mcard{height:96px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.mcard.flip{transform:rotateY(180deg)}
.mcard>div{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:var(--sh1);font-weight:900;font-size:17px;padding:6px;text-align:center}
.mcard .bk{background:linear-gradient(160deg,#FFB57A,#F07A1F);color:#fff}
.mcard .bk svg{width:40px;height:40px;opacity:.9}
.mcard .fr{background:#fff;transform:rotateY(180deg)}
.mcard .fr .pic{font-size:40px}
.mcard.done .fr{background:#E7F9EF;animation:jelly .6s}
.fc{height:300px;perspective:1000px;margin:10px 0 16px}
.fc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh2);padding:20px;text-align:center}
.fc .front{background:#fff}
.fc .back{background:linear-gradient(160deg,#FFB57A,#F07A1F);color:#fff;transform:rotateY(180deg)}
.fc .pic{font-size:80px}

/* library */
.bookc{width:120px;text-align:left}
.cover{width:120px;height:160px;border-radius:10px 20px 20px 10px;position:relative;overflow:hidden;box-shadow:3px 4px 10px rgba(154,66,18,.12);padding:12px 10px;color:#fff;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.cover::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:3px;background:rgba(0,0,0,.08)}
.cover:active{transform:rotateY(-12deg) scale(.97)}
.cover .ttl{font-weight:900;font-size:14px;line-height:1.15;position:relative}
.cover .catmini{position:absolute;left:12px;right:6px;bottom:4px;height:80px}
.reader{background:#FFFDF8}
.page{flex:1;margin:10px 20px;border-radius:26px;background:#fff;box-shadow:var(--sh1);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;transform-origin:left center;perspective:900px}
.page.turn{animation:turn .55s cubic-bezier(.4,0,.2,1)}
@keyframes turn{0%{transform:rotateY(0)}50%{transform:rotateY(-80deg);opacity:.4}51%{transform:rotateY(80deg)}100%{transform:rotateY(0)}}
.page .catbox{width:150px;height:150px}
.page .line{font-size:26px;font-weight:900}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gcard{border-radius:18px;padding:12px 8px;text-align:center;color:#fff;font-weight:900;box-shadow:var(--sh1)}
.gcard .tiny{font-weight:800;opacity:.9}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:var(--sh1);text-align:left;width:100%}
.listrow .em{font-size:26px;width:36px;text-align:center}
.listrow .ico{width:28px;height:28px}

/* community */
.seg{display:flex;background:#fff;border-radius:16px;padding:4px;box-shadow:var(--sh1);margin:0 20px}
.seg button{flex:1;height:38px;border-radius:12px;font-weight:900;font-size:14px;color:var(--mute);transition:all .25s}
.seg button.on{background:var(--o500);color:#fff}
.post{padding:14px;border-radius:22px;background:#fff;box-shadow:var(--sh1)}
.post .av{width:42px;height:42px}
.post .tx{font-size:16px;font-weight:700;margin:10px 0 4px}
.post .tr{font-size:13px;color:var(--mute);font-weight:700}
.post .acts{display:flex;gap:8px;margin-top:10px}
.post .acts button{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;color:var(--ink2);padding:6px 10px;border-radius:12px;background:var(--sand)}
.post .acts button.on{background:var(--o100);color:var(--o600)}
.post .acts .ico{width:18px;height:18px}
.corr{margin-top:8px;padding:10px 12px;border-radius:14px;background:#EFFAF4;font-size:13px;font-weight:700;color:#1E8F54}
.chat{background:var(--cream)}
.chathead{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;box-shadow:var(--sh1);z-index:2}
.chathead .av{width:40px;height:40px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 14px;border-radius:20px;font-weight:700;font-size:15px;line-height:1.35;animation:popin .35s cubic-bezier(.3,1.5,.5,1)}
.msg.them{background:#fff;align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--sh1)}
.msg.me{background:var(--o500);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg .tr{display:block;font-size:12px;opacity:.7;margin-top:4px}
.msg.stk{background:none;box-shadow:none;padding:0;width:110px;height:110px}
.composer{display:flex;gap:8px;padding:10px 12px 18px;background:#fff;align-items:center}
.composer input{flex:1;height:46px;border-radius:999px;border:0;background:var(--sand);padding:0 16px;font-weight:700;outline:0}
.composer .iconbtn{box-shadow:none;background:var(--o500);border-radius:50%}
.stkbar{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#fff;scrollbar-width:none}
.stkbar button{width:64px;height:64px;flex:none;border-radius:16px;background:var(--sand)}

/* profile */
.phead{background:linear-gradient(160deg,#FFB57A,#F07A1F);padding:16px 20px 70px;color:#fff;position:relative;overflow:hidden}
.phead .shine{position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12);left:-60px;bottom:-140px}
.pcard{margin:-54px 20px 0;position:relative;z-index:2;padding:16px;text-align:center}
.pcard .av{width:96px;height:96px;box-shadow:0 0 0 4px #fff;border-radius:50%}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px}
.pstats div{display:flex;flex-direction:column;font-size:11px;font-weight:800;color:var(--mute)}
.pstats b{font-size:18px;color:var(--ink)}
.rings{display:flex;justify-content:space-between;margin-top:12px}
.ringc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink2)}
.ringc svg{width:52px;height:52px}
.bigring{width:120px;height:120px;position:relative;flex:none}
.bigring svg{width:100%;height:100%}
.bigring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:900}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stampc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;text-align:center;color:var(--ink2)}
.stampc .s{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px}
.stampc.off .s{background:var(--sand)!important;filter:grayscale(1);opacity:.5}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;text-align:left;width:100%}
.setrow:last-child{border-bottom:0}
.setrow .ico{width:26px;height:26px}
.tgl{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tgl::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tgl.on{background:var(--o500)}.tgl.on::after{transform:translateX(18px)}
.subhead{display:flex;align-items:center;gap:10px;padding:14px 16px}
.subhead .h2{flex:1}
.notif{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:var(--sh1)}
.notif .em{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.goalring{display:flex;align-items:center;gap:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .d{height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;background:#fff;position:relative}
.cal .d.on{background:var(--o100);color:var(--o600)}
.cal .d.on svg{position:absolute;width:16px;height:16px;right:2px;bottom:2px}
.cal .d.today{box-shadow:0 0 0 2px var(--o500)}
.cal .h{font-size:11px;font-weight:900;color:var(--mute)}
.shopitem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:#fff;box-shadow:var(--sh1)}
.shopitem .ico{width:44px;height:44px}
.empty{padding:30px;text-align:center;color:var(--mute);font-weight:800}
[dir=rtl].tl{unicode-bidi:isolate}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* charcoal blob cat (from reference image 2): CSS-only animation */
.bcat{display:block;width:100%;height:100%;overflow:visible}
.bcat .bd{transform-box:fill-box;transform-origin:50% 100%;animation:bcs 2.6s ease-in-out infinite}
@keyframes bcs{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.94)}}
.bcat .ey{transform-box:fill-box;transform-origin:50% 50%;animation:bcb 4.6s infinite}
@keyframes bcb{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.bcat .ear{transform-box:fill-box;transform-origin:50% 100%;animation:bce 5.4s infinite}
@keyframes bce{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-14deg)}92%{transform:rotate(4deg)}}
.bcat .zz text{animation:fxz 2.2s ease-in-out infinite}.bcat .zz text:nth-child(2){animation-delay:.5s}
.bcat .q{animation:fxbob 1.4s ease-in-out infinite;transform-box:fill-box}
/* expanding stats */
.ringc{cursor:pointer;border-radius:14px;padding:6px 2px;transition:background .2s}
.ringc.on{background:var(--o50)}
.statpanel{overflow:hidden;transition:height .35s cubic-bezier(.3,1,.5,1)}
.sdet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sdet div{background:var(--sand);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;color:var(--ink2)}
.sdet b{display:block;font-size:17px;color:var(--ink)}
.ph{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:900;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== v2.2: welcome, auth ===== */
.mt4{margin-top:4px}
.welcome .wtop{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0}

.welcome .wbtns{gap:10px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.btn.line{background:#fff;color:var(--o600);border:2px solid var(--o500)}.btn.line:active{background:var(--o50)}
.authbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:15px;color:var(--ink);text-align:left}

.authbtn .ai{width:24px;height:24px;display:grid;place-items:center;flex:none}.authbtn .ai svg,.authbtn .ai .ico{width:22px;height:22px}

.orline{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--mute);font-weight:800;font-size:13px}

.field select{border:0;outline:0;background:none;font-size:15px;font-weight:800;width:100%;color:var(--ink);-webkit-appearance:none;appearance:none}
.otp{display:flex;gap:10px}

.guestbar{display:flex;align-items:center;gap:12px;margin:12px 20px 0;padding:12px 14px;border-radius:16px;background:var(--o50);border:1.5px solid var(--o100)}

.wlogo .o i{position:absolute;top:7px;width:4px;height:5px;border-radius:50%;background:#fff}.wlogo .o i:first-child{left:4px}.wlogo .o i:last-child{right:4px}
/* ===== v2.2: profile, settings, language, stamps, books ===== */
.avrow{display:flex;justify-content:center;margin-top:-64px;pointer-events:none}
.avbtn{pointer-events:auto;border-radius:50%;display:block;transition:transform .2s}.avbtn:active{transform:scale(.95)}
.langrow{justify-content:center;gap:8px;flex-wrap:wrap}

.favbook{width:120px;text-align:left;flex:none}
.hilite .cover{animation:hil .6s ease 1}

.cover .cdeco{position:absolute;right:-30px;top:-30px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.16)}

.cover .spine{position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.12)}

.cover.img{background-size:cover;background-position:center}
.cover .catmini{display:flex;justify-content:center;align-items:flex-end}
.cover .catmini .nks{height:100%;width:100%}
.stile{width:100%}
.stile:active{transform:scale(.97)}
.setrow.static{cursor:default}
.setrow .chev{width:18px;height:18px;flex:none;display:block}.setrow .chev svg{width:100%;height:100%}
.setrow .sav .av{width:32px;height:32px}
.setrow{min-height:56px}
.guestcard{padding:14px 16px;background:var(--o50);border:1.5px solid var(--o100)}
.iconbtn.spin .ico{animation:spin .7s linear infinite}

/* feed */
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:13px;color:var(--mute);transition:height .25s}

.post.fresh{box-shadow:0 0 0 2px var(--o200)}
.wordpost{background:linear-gradient(160deg,#F4F9FF,#fff)}
.wordpost .wbig{font-size:22px;font-weight:900}
.wordpost .wpic{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cmts{display:flex;flex-direction:column;gap:10px;max-height:40vh;overflow-y:auto}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt .av{width:34px;height:34px}
.cmt .cb{background:#fff;border-radius:4px 16px 16px 16px;padding:8px 12px;font-weight:700;font-size:14px;max-width:100%}
.cmt.me .cb{background:var(--o50)}
.sheet .composer{padding:0;background:none}
.sheet .composer input{background:#fff;border:1.5px solid var(--line)}
.sheet .composer .iconbtn:disabled{opacity:.45}
/* video cards with art, like the grammar guide */
.vthumb .vdeco{position:absolute;right:-18px;top:-18px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18)}
.vthumb .vbg{position:absolute;left:-10px;bottom:-14px;width:64px;height:56px;opacity:.3}.vthumb .vbg svg{width:100%;height:100%}
.vthumb .play{position:relative;z-index:1}
.vthumb .vtag{position:absolute;left:6px;top:6px;font-size:9px;font-weight:900;color:#fff;background:rgba(0,0,0,.18);padding:2px 6px;border-radius:6px;letter-spacing:.2px}
/* YouTube pop-up */
.ytveil{position:absolute;inset:0;z-index:80;background:rgba(20,14,10,.82);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.ytpop{width:100%;max-width:560px;background:#1b1512;border-radius:22px;overflow:hidden;animation:popin .45s cubic-bezier(.3,1.4,.5,1)}
.ytpop .yth{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;color:#fff}
.ytpop .yth b{flex:1;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytpop .yth .iconbtn{background:rgba(255,255,255,.12);border:0}
.ytpop .ytf{position:relative;aspect-ratio:16/9;background:#000}
.ytpop iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytpop .ytblocked{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;color:#fff;background:linear-gradient(160deg,#FF7A7F,#F2545B)}
.ytpop .ytblocked .nkw{width:84px;height:70px}
.ytpop .ytfoot{padding:10px 16px 14px;color:#cdbfb5;font-size:12px;font-weight:700}
.vposter{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;display:grid;place-items:center;color:#fff}
.vposter .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.vposter .play svg{width:28px;height:28px}
.vposter .vbg{position:absolute;right:-20px;bottom:-24px;width:180px;height:150px;opacity:.25}.vposter .vbg svg{width:100%;height:100%}
.vposter .vdeco{position:absolute;left:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.vposter .lbl{position:absolute;left:14px;bottom:12px;font-weight:900;font-size:13px;z-index:1}
/* ===== Neko v5 ===== */
.nk{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;--lx:0;--ly:0;user-select:none;-webkit-user-select:none}
.nk-move,.nk-fx{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%}
.nk-move{transition:transform 2.6s cubic-bezier(.45,0,.55,1)}
.neko{display:block;width:100%;height:100%;overflow:visible}
.neko.n5{filter:drop-shadow(0 1.6px 1.6px rgba(90,55,20,.16))}
.n5 .n5-body{fill:var(--c)}
.n5 .n5-tail{fill:var(--t)}
.n5 .n5-ft path{fill:var(--k)}
.n5 .n5-bl ellipse{fill:var(--b);opacity:.92}
.n5 .n5-sh{fill:rgba(90,60,30,.11)}
.n5 .n5-arm,.n5 .n5-pawb{fill:var(--c);stroke:rgba(40,20,10,.13);stroke-width:1.5}
.n5 .n5-pad{fill:var(--b)}
.n5 .n5-tongue{fill:#EF7187;transform-box:fill-box;transform-origin:50% 0}
.n5 .fx{transform-box:fill-box;transform-origin:50% 50%}
.n5 .fx-r{fill:#E0574F}.n5 .fx-b{fill:#8CC8E8}.n5 .fx-g{fill:#F2B544}.n5 .fx-p{fill:#E9E0D3}
/* always-on life: slow breathing, a little tail sway, blinking */
.n5 .n5-all{transform-box:view-box;transform-origin:100px 186px;animation:n5br 4.4s ease-in-out infinite}
.n5 .n5-tilt{transform-box:view-box;transform-origin:100px 186px}
.n5 .n5-tail{transform-box:fill-box;transform-origin:85% 40%;animation:n5tail 3.8s ease-in-out infinite}
.n5 .n5-face{transform:translate(calc(var(--lx,0) * 4.5px),calc(var(--ly,0) * 3px));transition:transform .8s cubic-bezier(.45,0,.25,1)}
.n5 .n5-ft,.n5 .n5-bl,.n5 .n5-pawh{transform-box:fill-box;transform-origin:50% 50%;transition:opacity .17s ease,transform .17s ease}
.n5 .n5-face.shut .n5-ft{opacity:0;transform:scaleY(.5)}
.n5 .n5-face.shut .n5-bl,.n5 .n5-pawh.shut{opacity:0}
.n5 .eg{transform-box:fill-box;transform-origin:50% 50%;transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.n5.sus .eg{transform:scale(1.45)}
.n5 .eb{transform-box:fill-box;transform-origin:50% 50%;animation:n5blink 5.6s ease-in-out infinite;transition:transform .07s ease}
.n5 .eg+.eg .eb{animation-delay:.05s}
.n5w .n5 .eb{animation:none}
.n5.blk .eb{transform:scaleY(.08)}
.n5 .n5-ft .hl{fill:#fff;opacity:.95}
.n5 .el{transition:transform .45s cubic-bezier(.45,0,.25,1);transform:translate(calc(var(--lx,0) * 1.3px),calc(var(--ly,0) * 1.1px))}
@keyframes n5br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.013,.986)}}
@keyframes n5tail{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-1.4px,-.8px) rotate(-6deg)}}
@keyframes n5blink{0%,92%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.1)}}
/* effects come in softly, then keep a slow loop of their own */
.n5-fx.in{transform-box:view-box;transform-origin:118px 82px;animation:n5in .6s cubic-bezier(.2,.9,.3,1.2) both}
.n5-fx.out{opacity:0;transition:opacity .28s ease}
@keyframes n5in{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
.p-love .fx,.pz-love .fx{animation:n5float 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.8s)}
.p-confused .fx,.pz-confused .fx{transform-origin:50% 100%;animation:n5wob 2.6s ease-in-out infinite}
.p-angry .fx,.pz-angry .fx{animation:n5pulse 1.4s ease-in-out infinite}
.p-surprised .fx,.pz-surprised .fx{transform-origin:50% 100%;animation:n5bob 1.9s ease-in-out infinite}
.p-sleep .fx,.pz-sleep .fx,.p-flop .fx,.p-flop2 .fx,.p-flopL .fx{opacity:0;animation:n5zz 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * .6s)}
.p-delighted .fx,.pz-delighted .fx{animation:n5tw 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.5s)}
.p-meh .fx,.p-phew .fx,.pz-meh .fx,.pz-phew .fx{transform-origin:0 50%;animation:n5puff 3.4s ease-out infinite}
.p-cry .fx,.pz-cry .fx{animation:n5shine 2.4s ease-in-out infinite}
.p-nervous .fx,.pz-nervous .fx{animation:n5sweat 3s ease-in-out infinite}
@keyframes n5float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.07)}}
@keyframes n5wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg) translateY(-1px)}}
@keyframes n5pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes n5bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes n5zz{0%{opacity:0;transform:translate(-3px,4px) scale(.7)}25%,70%{opacity:1}100%{opacity:0;transform:translate(4px,-6px) scale(1.08)}}
@keyframes n5tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.62) rotate(18deg);opacity:.6}}
@keyframes n5puff{0%{opacity:0;transform:translateX(-6px) scale(.6)}22%{opacity:1}70%{opacity:1;transform:translateX(2px) scale(1)}100%{opacity:0;transform:translateX(8px) scale(1.1)}}
@keyframes n5shine{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes n5sweat{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
/* how the body moves in each mood: slow and soft */
.p-happy .n5-tilt{animation:n5sway 3.4s ease-in-out infinite}
.p-delighted .n5-tilt{animation:n5hop 1.8s ease-in-out infinite}
.p-love .n5-tilt{animation:n5sway 4s ease-in-out infinite}
.p-cry .n5-tilt{animation:n5sob 1.8s ease-in-out infinite}
.p-angry .n5-tilt{animation:n5huff 1.4s ease-in-out infinite}
.p-nervous .n5-tilt{animation:n5fidget 2.2s ease-in-out infinite}
.p-sleep .n5-tilt,.p-flop .n5-tilt,.sc-bed .n5-tilt,.sc-blanket .n5-tilt{animation:n5sleep 4.8s ease-in-out infinite}
.p-lick .n5-tilt{animation:n5headbob 1.25s ease-in-out infinite}
@keyframes n5sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes n5hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-2.5%) scale(.99,1.01)}60%{transform:translateY(0) scale(1.02,.98)}}
@keyframes n5sob{0%,100%{transform:scale(1)}50%{transform:scale(1.018,.972)}}
@keyframes n5huff{0%,100%{transform:scale(1)}50%{transform:scale(1.025,.985)}}
@keyframes n5fidget{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
@keyframes n5sleep{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.975)}}
@keyframes n5headbob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.2deg)}}
/* paw cleaning and shy cover */
.p-lick .n5-pw.lk .n5-pwi{animation:n5lick 1.25s ease-in-out infinite}
.p-lick .n5-tongue{animation:n5tongue 1.25s ease-in-out infinite}
.p-cover .n5-pw .n5-pwi{animation:n5cover 2.8s ease-in-out infinite}
.p-cover .n5-pw.cv2 .n5-pwi{animation-delay:-.2s}
@keyframes n5lick{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-2.5px,-3.5px) rotate(-10deg)}}
@keyframes n5tongue{0%,30%,100%{transform:scaleY(.15)}50%,65%{transform:scaleY(1)}}
@keyframes n5cover{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
/* whole-cat moves (on the HTML wrapper): walking, a soft squish when petted, a fright squeeze */
.nk-fx.walking{animation:n5waddle .64s ease-in-out infinite}
.nk-fx.squish{animation:n5squish .72s cubic-bezier(.3,.9,.4,1)}
.nk-fx.fright{animation:n5fright .95s cubic-bezier(.3,.9,.4,1)}
@keyframes n5waddle{0%,100%{transform:rotate(-3deg) translateY(0)}25%{transform:rotate(0) translateY(-2%)}50%{transform:rotate(3deg) translateY(0)}75%{transform:rotate(0) translateY(-2%)}}
@keyframes n5squish{0%{transform:scale(1)}30%{transform:scale(1.08,.9)}62%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
@keyframes n5fright{0%{transform:scale(1)}18%{transform:scale(1.14,.8)}46%{transform:scale(.9,1.12) translateY(-4%)}76%{transform:scale(1.03,.98)}100%{transform:scale(1)}}
/* static cats (lists, cards, avatars) */
.nks{display:block;width:100%;height:100%;max-width:100%;max-height:100%}
.nks .neko.still *,.avf .neko.still *{animation:none!important}
.nks.br{transform-origin:50% 100%;animation:nkbr 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes nkbr{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}
.nkstk{display:flex;align-items:flex-end;justify-content:center;width:96px;height:84px}
.bc2{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%}
/* unit-card cat that looks around suspiciously, eyes wide, then gets confused */
.ac-q .n5-face{animation:n5acq 6s ease-in-out infinite}
.ac-q .eg{animation:n5acqe 6s ease-in-out infinite}
.ac-q .n5-fx{animation:n5acqf 6s ease-in-out infinite}
.ac-q .n5-tilt{animation:n5acqt 6s ease-in-out infinite}
@keyframes n5acq{0%,8%{transform:translateX(0)}18%,30%{transform:translateX(-5px)}40%,52%{transform:translateX(5px)}62%,100%{transform:translateX(0)}}
@keyframes n5acqe{0%,8%{transform:scale(1)}16%,56%{transform:scale(1.4)}64%,100%{transform:scale(1)}}
@keyframes n5acqf{0%,58%{opacity:0}68%,94%{opacity:1}100%{opacity:0}}
@keyframes n5acqt{0%,58%{transform:rotate(0)}68%,92%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
/* head turn: the body leans a touch toward where Neko looks */
.n5 .n5-bodyg{transform-box:view-box;transform-origin:100px 186px;transform:skewX(calc(var(--lx,0) * -2.4deg));transition:transform .8s cubic-bezier(.45,0,.25,1)}
/* tail swish, and a soft jelly wobble whenever the expression changes */

/* ===== v3 ===== */
/* typing: always dark text on light fields, even when the phone or viewer is in dark mode */
:root{color-scheme:light}
input,textarea,select{color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--o500);opacity:1}
input::placeholder,textarea::placeholder{color:var(--mute);-webkit-text-fill-color:var(--mute);opacity:1}
/* Recent lesson: as wide as the row, so it sits centered */
#recent>.recent{width:100%;max-width:none}
.recent .rart{position:absolute;right:10px;top:8px;width:78px;height:64px;display:grid;place-items:end center}
/* quick, jumpy pop-ups everywhere */
.veil{animation:fade .16s}
.sheet{animation:sheet3 .3s cubic-bezier(.2,1.25,.4,1)}
@keyframes sheet3{0%{transform:translateY(70%)}100%{transform:none}}
.pop{animation:popj .3s cubic-bezier(.2,.8,.3,1)}
@keyframes popj{0%{transform:scale(.55);opacity:0}50%{transform:scale(1.05,.95);opacity:1}75%{transform:scale(.98,1.02)}100%{transform:none}}

.opts.col{grid-template-columns:1fr;gap:10px}

.rline{font-size:24px;font-weight:900;line-height:1.7;text-align:center}

.ac{overflow:visible}

function pawTargets(state,{fx,fy,es,W,H,t,lean}){
  const base=[{x:CX-20+lean*.2,y:GROUND-4},{x:CX+20+lean*.2,y:GROUND-4}];
  const w=Math.sin(t*9)*12;
  switch(state){
    case 'happy':return[{x:CX-W/2-2,y:fy-4,r:-30+w,beans:1},{x:CX+W/2+2,y:fy-4,r:30-w,beans:1}];
    case 'cover':return[{x:fx-es,y:fy,s:1.55,beans:1},{x:fx+es,y:fy,s:1.55,beans:1}];
    case 'peek':return[{x:fx-es,y:fy,s:1.55,beans:1},{x:fx+es+4,y:fy+24,s:1.4,beans:1,r:20}];
    case 'lick':return[base[0],{x:fx+16,y:fy+20+Math.sin(t*10)*3,r:-30,s:1.1,beans:1}];
    case 'playful':return[base[0],{x:CX+W/2-4+Math.sin(t*8)*6,y:GROUND-12+Math.cos(t*8)*4,r:20}];
    case 'melt':return[{x:CX-W/2+6,y:GROUND-2},{x:CX+W/2-6,y:GROUND-2}];
    case 'sleepy':return[{hide:1},{hide:1}];
    default:return base;
  }
}

/* Live jelly cat: spring physics on the body outline, pose morphing, blinking, gaze */
class LiveCatOld{
  constructor(host,{coat='orange',state='idle',onPet=null,wander=true}={}){
    this.host=host;this.coat=coat;this.state=state;this.base=state;this.onPet=onPet;this.wander=wander;
    this.p=Object.assign({},POSE[state]);this.v={W:0,H:0,lean:0,tilt:0};
    this.jel=Array.from({length:NP},()=>[0,0]);this.jv=Array.from({length:NP},()=>[0,0]);
    this.t=0;this.gx=0;this.gy=0;this.tgx=0;this.tgy=0;this.hop=0;this.hv=0;this.blinkUntil=0;this.flick=0;this.flickUntil=0;this.paws=null;
    host.innerHTML=`<svg class="cat live" viewBox="-10 -40 220 230" role="img" aria-label="Neko the cat"><g class="root"></g></svg>`;
    this.root=host.querySelector('.root');host.style.cursor='pointer';
    host.addEventListener('click',()=>this.pet());
    this.nextBlink=performance.now()+2000;this.nextEar=performance.now()+3000;this.nextHop=performance.now()+4000;
    this.last=performance.now();this.alive=true;
    const loop=now=>{if(!this.alive)return;if(!document.body.contains(this.host)){this.alive=false;return}
      const dt=Math.min(.04,(now-this.last)/1000);this.last=now;this.step(dt,now);requestAnimationFrame(loop)};
    requestAnimationFrame(loop);
  }
  impulse(a){for(let i=0;i<NP;i++){const th=-Math.PI/2+i*2*Math.PI/NP;const s=Math.sin(th),c=Math.cos(th);this.jv[i][1]+=(s<0?a*(-s):0)*9;this.jv[i][0]+=c*a*5}}
  step(dt,now){
    this.t+=dt;const T=POSE[this.state]||POSE.idle,k=70,cdamp=11;
    for(const key of ['W','H','lean','tilt']){this.v[key]+=(k*(T[key]-this.p[key])-cdamp*this.v[key])*dt;this.p[key]+=this.v[key]*dt}
    ['o','sl','pr'].forEach(key=>{this.p[key]+=(T[key]-this.p[key])*Math.min(1,dt*10)});this.p.eyes=T.eyes;this.p.big=T.big;
    if(this.state==='angry')this.p.tilt=T.tilt+Math.sin(this.t*30)*2.2;
    const breathe=Math.sin(this.t*2.1)*(this.state==='sleepy'?3:1.6);
    // jelly springs with neighbour coupling
    for(let i=0;i<NP;i++){const a=this.jel[i],v=this.jv[i],l=this.jel[(i-1+NP)%NP],r=this.jel[(i+1)%NP];
      for(let d=0;d<2;d++){v[d]+=(-140*a[d]+40*(l[d]+r[d]-2*a[d])-7*v[d])*dt;a[d]+=v[d]*dt}}
    // hop
    this.hv+=(-260*this.hop-14*this.hv)*dt;this.hop+=this.hv*dt;
    if(this.state==='happy'&&(this.t%0.7)<dt){this.hv-=130;this.impulse(.9)}
    if(this.wander&&this.state==='idle'&&now>this.nextHop){this.nextHop=now+3500+Math.random()*4000;if(Math.random()<.6){this.impulse(1.2);this.hv-=90}else{this.tgx=(Math.random()-.5)*1.6;this.tgy=(Math.random()-.5)*.8}}
    if(now>this.nextBlink){this.blinkUntil=now+130;this.nextBlink=now+2400+Math.random()*3400;if(Math.random()<.25)this.nextBlink=now+260}
    if(now>this.nextEar){this.flick=Math.random()<.5?-1:1;this.flickUntil=now+220;this.nextEar=now+3000+Math.random()*4000}
    this.gx+=(this.tgx-this.gx)*Math.min(1,dt*8);this.gy+=(this.tgy-this.gy)*Math.min(1,dt*8);
    const pose=Object.assign({},this.p,{H:this.p.H+breathe,W:this.p.W-breathe*.6});
    const tgt=pawTargets(this.state,{fx:CX+pose.lean*.62,fy:GROUND-pose.H*.56,es:Math.min(pose.W*.2,27),W:pose.W,H:pose.H,t:this.t,lean:pose.lean});
    if(!this.paws)this.paws=tgt.map(p=>Object.assign({x:CX,y:GROUND-4},p));
    this.paws=this.paws.map((p,i)=>{const q=tgt[i];if(q.hide)return{x:p.x,y:p.y,hide:1};const f=Math.min(1,dt*12);return{x:p.x+(q.x-p.x)*f,y:p.y+(q.y-p.y)*f,r:(p.r||0)+((q.r||0)-(p.r||0))*f,s:(p.s||1)+((q.s||1)-(p.s||1))*f,beans:q.beans}});
    const wagSpeed={happy:9,playful:12,angry:16,idle:2.4}[this.state]||1.4;
    const blink=now<this.blinkUntil&&!['happy','sleepy','cover','love'].includes(this.state);
    const html=catMarkup(this.state,this.coat,{p:pose,t:this.t,jel:this.jel,wob:this.state==='melt'?2.4:1.3,gx:this.gx,gy:this.gy,blink,flick:now<this.flickUntil?this.flick:0,wag:Math.sin(this.t*wagSpeed)*10,paws:this.paws,lk:Math.sin(this.t*12)*1.5});
    this.root.setAttribute('transform',`translate(0 ${this.hop.toFixed(1)})`);this.root.innerHTML=html;
  }
  set(state,holdMs){
    if(!POSE[state])state='idle';
    clearTimeout(this.hold);
    if(holdMs)this.hold=setTimeout(()=>this.set(this.base),holdMs);else this.base=state;
    if(state!==this.state){this.state=state;this.impulse(.8)}
  }
  pet(){this.impulse(1.6);this.hv-=110;if(this.state!=='happy')this.set('love',1600);try{Sound.purr()}catch(e){};this.onPet&&this.onPet()}
  look(x,y){this.tgx=Math.max(-1,Math.min(1,x));this.tgy=Math.max(-1,Math.min(1,y))}
}

function ring(p,c='#F07A1F',w=8,track='#FFE6D1'){const r=20-w/2,C=2*Math.PI*r;return svg('0 0 40 40',`<circle cx="20" cy="20" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(C*Math.max(0,Math.min(1,p))).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 20)"/>`)}

/* finish any sign up / log in (simulated) */
function signedIn(provider,mode){
 S.guest=false;S.account=provider;if(!S.name)S.name=PROFILE.name;save();
 if(mode==='upgrade'){Sound.good();toast(`${ic('check')} Signed in with ${SOCNAME[provider]}. Your progress is saved.`);go(TAB||'home');return}
 if(mode==='login'&&S.onboarded){go('home');return}
 if(mode==='login'){S.onboarded=true;S.toured=true;save();Sound.win();loading(()=>{go('home');toast(`${ic('paw')} Welcome back, ${esc(S.name.split(' ')[0])}!`)},1600,{say:'Fetching your lessons…'});return}
 setup(0);
}
function socialAuth(provider,mode){loading(()=>signedIn(provider,mode),1300,{say:`Connecting to ${SOCNAME[provider]}…`,tip:false})}
function phoneFlow(mode){

  <div class="obfoot"><button class="btn block" id="go">Send code</button></div>`,'ob');
 const c=catIn($('#pc',d),{state:'idle',wander:false}),say=$('#say',d),pn=$('#pn',d),go1=$('#go',d);let sent=false;
 pn.oninput=()=>{pn.value=pn.value.replace(/[^\d ]/g,'');c.look(Math.min(1,-.8+pn.value.length/8),.6)};
 $('#bk',d).onclick=back;
 const os=$$('[data-o]',d);os.forEach((o,i)=>{o.oninput=()=>{o.value=o.value.replace(/\D/g,'').slice(0,1);if(o.value&&os[i+1])os[i+1].focus();if(os.every(x=>x.value))finish()};o.onkeydown=e=>{if(e.key==='Backspace'&&!o.value&&os[i-1])os[i-1].focus()}});
 const finish=()=>{Sound.good();c.set('happy');say.textContent='Purr! You are in.';setTimeout(()=>signedIn('phone',mode),700)};
 go1.onclick=()=>{
  if(!sent){if(pn.value.replace(/\D/g,'').length<7){c.set('confused',1600);Sound.bad();say.textContent='Hmm, that number looks short. Try again?';pn.focus();return}

/* email form (from "Use email instead") */
function login(mode){
 const d=screen(`<div class="obtop"><button class="iconbtn" id="bk" aria-label="Back">${ic('back')}</button><div class="grow"></div></div>
  <div class="obbody">
   <div class="catrow"><div class="catbox" id="lc"></div><div class="bubble left grow" id="say">Welcome back! Log in and I’ll fetch your lessons.</div></div>
   <h1 class="h1">Log in with email</h1>
   <div class="col mt16">
    <label class="field">${ic('mail')}<input id="em" type="email" placeholder="Email" autocomplete="email" aria-label="Email"></label>
    <label class="field">${ic('key')}<input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="link" id="show" type="button">Show</button></label>
   </div>
   <p class="small muted b mt12">Prototype: nothing is sent anywhere. Any email works.</p>
  </div>
  <div class="obfoot col"><button class="btn block" id="go">Log in</button></div>`,'ob');
 const c=catIn($('#lc',d),{state:'idle',wander:false});const say=$('#say',d);
 const em=$('#em',d),pw=$('#pw',d);let shown=false;
 em.onfocus=()=>{c.set('idle');c.look(-.6,.6)};em.oninput=()=>c.look(Math.min(1,-.8+em.value.length/14),.7);em.onblur=()=>c.look(0,0);
 pw.onfocus=()=>{c.set(shown?'peek':'cover');say.textContent=shown?'I can see it! Hide it?':'I’m not looking, promise!'};pw.onblur=()=>c.set('idle');
 $('#show',d).onclick=e=>{e.preventDefault();shown=!shown;pw.type=shown?'text':'password';$('#show',d).textContent=shown?'Hide':'Show';c.set(shown?'peek':'cover');pw.focus()};
 $('#bk',d).onclick=()=>S.onboarded?go(TAB||'home'):welcome();
 $('#go',d).onclick=()=>{const ok=/^\S+@\S+\.\S+$/.test(em.value.trim());if(!ok){c.set('confused',1800);Sound.bad();say.textContent='Hmm, that email looks odd. It needs an @ and a dot.';em.focus();return}
  if(pw.value.length<4){c.set('nervous',1500);Sound.bad();say.textContent='Your password needs at least 4 characters.';pw.focus();return}
  Sound.good();c.set('happy');say.textContent='Purr! Welcome back.';setTimeout(()=>signedIn('email',mode),800)};
}

/* set-up steps (Figma: Language → About user → Purpose → Level → Time). Guests skip the name step. */
let OB={step:0};
function setup(step){OB.step=step;const add=OBADD;
 const keys=add?['level','time']:isGuest()?['lang','purpose','level','time']:['lang','name','purpose','level','time'];
 const N=keys.length,key=keys[step],lgName=LANGS[S.lang].name;
 const steps={
  lang:{say:'Which language do you want to learn?',mood:'idle',body:`<div class="opt-list">${Object.entries(LANGS).map(([k,l])=>`<button class="optrow ${S.lang===k?'on':''}" data-lang="${k}">${flag(k)}<div class="grow"><div>${l.name}</div><div class="small muted ${k==='ar'?'ar':k==='ja'?'ja':''}">${l.native}</div></div></button>`).join('')}</div>`},
  name:{say:'What should I call you?',mood:'playful',body:`<label class="field">${ic('paw')}<input id="nick" maxlength="24" placeholder="Your name" value="${esc(S.name||PROFILE.name)}" aria-label="Your name"></label>
    <div class="row mt12" style="flex-wrap:wrap;gap:8px">${[PROFILE.name,'Mochi','Tofu','Sunny'].map(n=>`<button class="chip" data-nick="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <p class="small muted b mt12">This name is shown on your profile. You can change it later.</p>`},
  purpose:{say:`Why are you learning ${lgName}?`,mood:'happy',body:`<div class="grid2">${[['Travel','✈️'],['Study','🎓'],['Work','💼'],['Friends','💬'],['Culture','🎎'],['Just for fun','🎲']].map(([t,e])=>`<button class="tile ${S.purpose===t?'on':''}" data-p="${t}"><span class="em">${e}</span>${t}</button>`).join('')}</div>`},
  level:{say:`Do you know some ${lgName} already?`,mood:'confused',body:`<button class="optrow" id="lvpick" style="width:100%"><span class="tag" style="background:${LEVELS[lvlIdx(S.level)].color};color:#fff;font-size:14px;padding:6px 10px">${S.level}</span><div class="grow">${LEVELS[lvlIdx(S.level)].name}</div><span class="ico" style="width:20px;height:20px">${IC.caret()}</span></button>
    <p class="small muted b mt12">Not sure? Start with A1. You can change it anytime.</p>`},
  time:{say:'How much time can we play each day?',mood:'sleepy',body:`<div class="opt-list">${[[5,'Catnap','😴'],[10,'Stroll','🐾'],[15,'Play time','🧶'],[20,'Zoomies','⚡']].map(([m,n,e])=>`<button class="optrow ${S.goal===m?'on':''}" data-goal="${m}"><span class="em">${e}</span><div class="grow">${n}</div><span class="muted">${m} min</span></button>`).join('')}</div>`}
 }[key];
 const d=screen(`<div class="obtop"><button class="iconbtn" id="bk" aria-label="Back">${ic('back')}</button><div class="dots">${Array.from({length:N},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${add?`<span class="tag row" style="background:var(--o50);color:var(--o600);gap:6px">${flag(add.lang)}New</span>`:isGuest()?'<span class="tag" style="background:var(--o50);color:var(--o600)">Guest</span>':''}</div>
  <div class="obbody"><div class="catrow"><div class="catbox" id="oc"></div><div class="bubble left grow">${esc(steps.say)}</div></div>${steps.body}</div>
  <div class="obfoot"><button class="btn block" id="next">${step===N-1?'Start learning':'Continue'}</button></div>`,'ob');
 const c=catIn($('#oc',d),{state:steps.mood});
 $('#bk',d).onclick=()=>{if(step)return setup(step-1);if(add){OBADD=null;switchLang(add.prev);save();go(add.tab);return}welcome()};
 $$('[data-lang]',d).forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;if(!S.langs.includes(S.lang))S.langs=[S.lang];save();$$('[data-lang]',d).forEach(x=>x.classList.toggle('on',x===b));c.set('happy',1200);Sound.tap();speak(LANGS[S.lang].hello,LANGS[S.lang].code)});
 const nick=$('#nick',d);if(nick){nick.oninput=()=>{S.name=nick.value.trim();save()};$$('[data-nick]',d).forEach(b=>b.onclick=()=>{nick.value=b.dataset.nick;S.name=b.dataset.nick;save();c.set('happy',900)})}
 $$('[data-p]',d).forEach(b=>b.onclick=()=>{S.purpose=b.dataset.p;save();$$('[data-p]',d).forEach(x=>x.classList.toggle('on',x===b));c.set('love',1000)});
 $$('[data-goal]',d).forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();$$('[data-goal]',d).forEach(x=>x.classList.toggle('on',x===b));c.set(S.goal>=20?'scream':S.goal>=15?'playful':'idle',900)});
 const lp=$('#lvpick',d);if(lp)lp.onclick=()=>{const v=sheet(`<h2 class="h2">Choose your level</h2><div class="opt-list mt16">${LEVELS.map(l=>`<button class="optrow ${S.level===l.id?'on':''}" data-lv="${l.id}"><span class="tag" style="background:${l.color};color:#fff;font-size:14px;padding:6px 10px">${l.id}</span><div class="grow">${l.name}</div>${UNITS[l.id].some(playable)?'':`<span class="tag locktag">Soon</span>`}</button>`).join('')}</div>`);
  $$('[data-lv]',v).forEach(b=>b.onclick=()=>{const id=b.dataset.lv;if(!UNITS[id].some(playable)){toast('B1 and up are coming soon. Start with A2 for now.');return}S.level=id;save();v.close();setup(step)})};
 $('#next',d).onclick=()=>{
  if(key==='name'&&!S.name){S.name=($('#nick',d).value.trim())||PROFILE.name;save()}
  if(step<N-1){Sound.tap();setup(step+1);return}
  if(add){OBADD=null;if(!S.langs.includes(add.lang))S.langs.push(add.lang);S.course[add.lang]={level:S.level,goal:S.goal};save();Sound.win();
   loading(()=>{go('home');toast(`${flag(add.lang)} ${LANGS[add.lang].name} added!`)},2600,{say:`Getting your ${lgName} lessons ready…`});return}
  S.onboarded=true;save();Sound.win();loading(()=>{go('home');if(!S.toured)setTimeout(tour,500)},2600,{say:`Getting your ${lgName} lessons ready…`});
 };
}

/* ===== Loading screen: cat + yarn bar + language tip ===== */
function loading(next,ms=2200,{say='',tip=true}={}){
 const lg=S.lang,t=rnd(TIPS[lg]||GENERAL_TIPS);
 const d=screen(`${say?`<div class="bubble rise" style="max-width:300px">${esc(say)}</div>`:''}<div class="catbox" id="ldc"></div>
  <div class="yarnbar"><i id="yb"></i><span class="ball" id="yball">${IC.yarn('#F9994B')}</span></div>
  ${tip?`<div class="tipcard rise" style="animation-delay:.2s"><div class="row">${flag(lg)}<b class="small" style="color:var(--o600)">DID YOU KNOW?</b></div><div class="b">${esc(t)}</div></div>`:''}`,'loading');
 const c=catIn($('#ldc',d),{state:'idle',wander:false,scene:'bed'});
 const seq=['idle','playful','idle','happy'];let k=0;const iv=setInterval(()=>{if(!d.isConnected){clearInterval(iv);return}c.set(seq[++k%seq.length])},900);
 const t0=performance.now();const yb=$('#yb',d),ball=$('#yball',d);
 const step=now=>{if(!d.isConnected)return;const p=Math.min(1,(now-t0)/ms);yb.style.width=p*100+'%';ball.style.left=p*100+'%';ball.style.transform=`rotate(${p*720}deg)`;if(p<1)requestAnimationFrame(step);else{clearInterval(iv);next()}};
 requestAnimationFrame(step);
}

/* ===== Main shell with tabs (Figma: Community, Learn, Home, Library, Profile) ===== */
let TAB='home';
const TABS=[['community','Community'],['learn','Learn'],['home','Home'],['library','Library'],['profile','Profile']];
let GOFRESH=true;
function go(tab=TAB){GOFRESH=!APP.querySelector('.scr.main.'+tab);TAB=tab;tick();
 const views={home:homeView,learn:learnView,library:libraryView,community:communityView,profile:profileView};
 const d=screen(`<div class="scroll" id="main">${views[tab]()}</div>
  <nav class="tabs" aria-label="Main">${TABS.map(([k,n])=>`<button class="tab ${k==='home'?'home':''} ${TAB===k?'on':''}" data-tab="${k}" id="tab-${k}" aria-label="${n}"><span class="ico">${TB[k]}</span>${k==='home'?'':n}</button>`).join('')}</nav>`,'main '+tab);
 const pop=el=>{const i=el&&$('.ico',el);if(!i)return;i.classList.remove('popsq');void i.offsetWidth;i.classList.add('popsq')};
 $$('[data-tab]',d).forEach(b=>b.onclick=()=>{Sound.tap();if(b.dataset.tab!==TAB){const t=b.dataset.tab;go(t);pop($('#tab-'+t))}else{pop(b);const m=$('#main');m&&m.scrollTo({top:0,behavior:'smooth'})}});
 ({home:bindHome,learn:bindLearn,library:bindLibrary,community:bindCommunity,profile:bindProfile})[tab](d);

 const rows={
  words:[['Words learned',(S.seen[L()]||[]).length],['Word lessons',`${done}/${units.length}`],['Quests answered',st.q],['Accuracy',acc]],
  listen:[['Listening lessons',`${done}/${units.length}`],['Sounds heard',st.q],['Right answers',st.ok],['Accuracy',acc]],
  read:[['Books read',Object.keys(S.books).length],['Reading lessons',`${done}/${units.length}`],['Sentences read',Object.keys(S.books).length*3],['Accuracy',acc]],
  quiz:[['Quizzes done',`${done}/${units.length}`],['Questions',st.q],['Right answers',st.ok],['Accuracy',acc]],
  video:[['Videos watched',Object.keys(S.videos).length],['Video lessons',`${done}/${units.length}`],['Video quests',st.q],['Accuracy',acc]]
 }[s.id];
 return {pct:done/units.length,title:`${s.name}`,sub:rows[0][1]+' '+rows[0][0].toLowerCase(),rows}}
