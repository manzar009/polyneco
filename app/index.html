/* ===== Notifications ===== */
function notifications(){S.notifRead=true;save();
 const items=[['🐱','#FFF1E5','Neko saved a lesson for you','Unit '+(recentKeys()[0].split('-')[1]*1+1)+' is waiting','now','lesson'],['🐾','#E7F9EF','Kumo liked your post','2 new paws','1h','post'],['🎬','#FFECEC','New video in '+LG().name,VIDEOS[L()][1].title,'3h','video'],['🏆','#FFF7DC',LEAGUES[3].name+' League update','You are #'+myRank()+' this week','5h','league'],['📦','#F1ECFF','Grade progress',`${S.tasks%TASKS_PER_GRADE}/${TASKS_PER_GRADE} tasks to your next surprise box`,'1d','grade']];
 const d=screen(`<div class="subhead"><button class="iconbtn" id="bk" aria-label="Back">${ic('back')}</button><h2 class="h2">Notifications</h2></div><div class="scroll pad col" style="padding-bottom:30px">${items.map(n=>`<button class="notif" data-go="${n[5]}"><span class="em" style="background:${n[1]}">${n[0]}</span><div class="grow"><b>${esc(n[2])}</b><div class="small muted b">${esc(n[3])}</div></div><span class="tiny muted b">${n[4]}</span><span class="nchev">${IC.chev()}</span></button>`).join('')}</div>`);
 $('#bk',d).onclick=()=>go('home');
 $$('[data-go]',d).forEach(b=>b.onclick=()=>{Sound.tap();notifGo(b.dataset.go)});
}
/* where each notification leads */
function notifGo(k){
 if(k==='lesson'){const key=recentKeys()[0];go('home');setTimeout(()=>{const el=$(`[data-recent="${key}"]`)||$(`[data-unit="${key}"]`)||APP;unitCard(el,key)},260)}
 else if(k==='post'){CSEG='feed';go('community');const mine=S.myPosts.length?'m0':'';
  if(!mine){setTimeout(()=>chatView('kumo'),240);return}
  setTimeout(()=>{const p=$(`[data-post="${mine}"]`);if(!p)return;p.scrollIntoView({behavior:'smooth',block:'center'});p.classList.remove('hilite');void p.offsetWidth;p.classList.add('hilite');toast(`${ic('paw')} Kumo liked this post`)},320)}
 else if(k==='video')videoScreen(VIDEOS[L()][1]);
 else if(k==='league')leaderboard();
 else if(k==='grade'){go('home');setTimeout(gradeSheet,240)}
}
/* grade progress: where you are, what the next surprise box needs, and a button to do the next task */
function gradeSheet(){const g=S.grade,inG=S.tasks%TASKS_PER_GRADE,last=g>=GRADES.length-1,left=TASKS_PER_GRADE-inG;
 const v=sheet(`<div class="row"><div style="width:84px;height:84px;flex:none" id="gsc"></div><div class="grow"><span class="tag" style="background:#F1ECFF;color:#6B4FD8">Grade ${g+1} of ${GRADES.length}</span><h2 class="h2 mt8">${esc(GRADES[g])}</h2></div></div>
  <div class="card mt16" style="padding:14px"><div class="row"><b class="grow">${last?'Top grade reached':`Next: ${esc(GRADES[g+1])}`}</b><span class="small muted b">${inG}/${TASKS_PER_GRADE} tasks</span></div>
   <div class="bar mt8"><i id="gbar" style="width:0%;background:#9B7BF7"></i></div>
   <p class="small muted b mt8">${last?'You reached the top grade. Every 10 tasks still brings Neko a surprise box.':`${left} more task${left===1?'':'s'} and Neko brings you a surprise box.`}</p></div>
  <button class="btn block mt16" id="gdo">${ic('play','#fff')} Do a task now</button>`);
 catIn($('#gsc',v),{state:'happy',wander:false});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$('#gbar',v);if(b){b.style.transition='width .9s cubic-bezier(.33,1,.68,1)';b.style.width=(inG/TASKS_PER_GRADE*100)+'%'}}));
 $('#gdo',v).onclick=()=>{v.close();const k=recentKeys()[0],p=progOf(k);let j=p.findIndex(x=>!x);if(j<0)j=3;startSkill(k,j)};
}

/* ===== Goal (Figma: Goal) and Paw Trail (own take on daily rhythm) ===== */
function trailSheet(){const n=trailCount(),days=Array.from({length:14},(_,i)=>addDays(today(),i-13)),set=new Set(S.trail);
 const pts=days.map((_,i)=>[24+i*(300/13),62+Math.sin(i*.9)*26]);
 const path='M'+pts.map(p=>p.map(x=>x.toFixed(1)).join(' ')).join('L');
 const miles=[[3,'🐟','Fish bowl',20],[7,'🧶','Yarn ball',50],[14,'🛋️','Comfy cushion',100],[30,'🏆','Trail trophy',250]];
 const v=sheet(`<div class="row"><h2 class="h2 grow">Paw Trail</h2><span class="tag" style="background:var(--o100);color:var(--o600);font-size:13px">${n} day${n===1?'':'s'}</span></div>
  <p class="small muted b mt8">Every day you learn, Neko walks one step along the garden path.</p>
  <div class="card mt12" style="padding:6px 0;position:relative;background:linear-gradient(180deg,#F2FBF5,#E3F6EA)"><svg viewBox="0 0 348 130" style="width:100%;display:block">
   <path d="${path}" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="#D9EFE0" stroke-width="2" stroke-dasharray="4 8"/>
   ${pts.map((p,i)=>{const on=set.has(days[i]),t=i===13;return `<g transform="translate(${p[0]-9} ${p[1]-9}) rotate(${(i%2?12:-12)} 9 9)"><g transform="scale(.45)" opacity="${on?1:.28}">${IC.paw(on?'#F07A1F':'#B9A99A').replace(/<\/?svg[^>]*>/g,'')}</g></g>${t?`<circle cx="${p[0]}" cy="${p[1]}" r="15" fill="none" stroke="#F07A1F" stroke-width="2.5" stroke-dasharray="3 4"/>`:''}`}).join('')}
   <text x="12" y="124" font-size="10" font-weight="800" fill="#7FA58C" font-family="Nunito">2 weeks ago</text><text x="336" y="124" text-anchor="end" font-size="10" font-weight="800" fill="#7FA58C" font-family="Nunito">Today</text></svg>
   <div id="trc" style="position:absolute;width:64px;height:64px;right:2px;top:-30px"></div></div>
  <h3 class="h3 mt16">Treats on the path</h3><div class="col mt12">${miles.map(m=>{const ok=n>=m[0],cl=S.trailClaimed[m[0]];return `<div class="listrow"><span class="em">${m[1]}</span><div class="grow"><b>${m[2]}</b><div class="small muted b">Day ${m[0]} · +${m[3]} coins</div></div>${ok&&!cl?`<button class="btn sm" data-m="${m[0]}" data-c="${m[3]}">Claim</button>`:`<span class="small b muted">${cl?'Claimed':`${Math.max(0,m[0]-n)} to go`}</span>`}</div>`}).join('')}</div>
  <div class="listrow mt12" style="background:#F1ECFF">${ic('blanket')}<div class="grow"><b>Cozy blankets: ${S.boosts.blanket||0}</b><div class="small muted b">Missed a day? A blanket keeps your trail safe.</div></div></div>`);
 catIn($('#trc',v),{state:n?'happy':'sleepy',wander:false});
 $$('[data-m]',v).forEach(b=>b.onclick=()=>{S.trailClaimed[b.dataset.m]=1;S.coins+=+b.dataset.c;save();Sound.coin();v.close();trailSheet()});
}

/* ===== Shop (from the coins pill) ===== */
function shopSheet(coatsOnly=false){
 const v=sheet(`<div class="row"><h2 class="h2 grow">${coatsOnly?'Avatar color':'Cat shop'}</h2><span class="pill">${ic('coin')}<span id="sc">${S.coins}</span></span></div>
  ${coatsOnly?'':`<div class="col mt16">${Object.entries(BOOSTS).map(([k,b])=>`<div class="shopitem">${ic(b.icon)}<div class="grow"><b>${esc(b.name)}</b><div class="small muted b">${esc(b.desc)}</div><div class="tiny b" style="color:var(--o600)"><span data-have="${k}">You have ${S.boosts[k]||0}</span>${k==='sunbeam'&&sunOn()?' · active now':''}</div></div><button class="btn sm" data-buy="${k}">${b.price}</button></div>`).join('')}</div>
   ${S.boosts.sunbeam>0&&!sunOn()?`<button class="btn soft block mt12" id="usesun">${ic('sun')} Use a sunbeam nap now</button>`:''}`}
  <h3 class="h3 mt24">Avatar</h3><button class="shopitem mt12" id="toav" style="width:100%;text-align:left">${meav(48)}<div class="grow"><b>Expressions and colors</b><div class="small muted b">${COAT_SHOP.length} coat colors · ${AVMOODS.length} faces</div></div><span class="ico">${IC.caret?IC.caret():''}</span></button>`);
 $$('[data-buy]',v).forEach(b=>b.onclick=()=>{const k=b.dataset.buy,it=BOOSTS[k];if(S.coins<it.price){b.classList.remove('jelly');void b.offsetWidth;b.classList.add('jelly');toast(`${ic('coin')} Not enough paw coins yet`);return}const from=S.coins;S.coins-=it.price;S.boosts[k]=(S.boosts[k]||0)+1;save();Sound.coin();countUp($('#sc',v),from,S.coins,400);const cv=$('#coinv');if(cv)cv.textContent=S.coins;const hv=$(`[data-have="${k}"]`,v);if(hv)hv.textContent=`You have ${S.boosts[k]}`;b.classList.remove('jelly');void b.offsetWidth;b.classList.add('jelly');toast(`${ic(it.icon)} ${esc(it.name)} added`)});
 const us=$('#usesun',v);if(us)us.onclick=()=>{S.boosts.sunbeam--;S.sunUntil=Date.now()+15*60e3;save();v.close();toast(`${ic('sun')} Double fish for 15 minutes!`)};
 $('#toav',v).onclick=()=>{v.close();avatarSheet()};
 v.addEventListener('click',e=>{if(e.target===v&&TAB==='home'&&$('#coinv'))$('#coinv').textContent=S.coins});
}

/* ===== Boot ===== */
window.polyneco={state:()=>S,lesson:()=>LS,tour,go,dbg:{speak,speakSeq,loadClips,vkey,LANGS,STORY4,GL4,VOCAB,W,SENT,sPlain,chatReply,resultScreen,loading}};
if(!S.onboarded)splash();else loading(()=>{go('home');if(!S.toured)setTimeout(tour,400)},1600);
}</script></body></html>
